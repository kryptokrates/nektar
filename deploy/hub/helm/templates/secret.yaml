{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nektar-hub.fullname" . }}
  labels:
    {{- include "nektar-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEKTAR_HTTP_TOKEN: {{ .Values.secrets.httpToken | default (randAlphaNum 48) | quote }}
  NEKTAR_OPERATOR_TOKEN: {{ .Values.secrets.operatorToken | default (randAlphaNum 48) | quote }}
{{- end }}
