<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="Usage rights specify Use Only vs Resellable and Freshness labels facts as Temporary, Versioned, or Evergreen">
  <title>Usage Rights and Freshness</title>
  <rect width="320" height="140" rx="12" fill="#151211"/>
  <!-- Top row: Rights -->
  <rect x="16" y="16" width="138" height="46" rx="9" fill="#1e1a17" stroke="#3a342f" stroke-width="1.4"/>
  <text x="85" y="35" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" font-weight="800" fill="#f4efe6">USE ONLY</text>
  <text x="85" y="51" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#958d85">Private · No resell</text>

  <rect x="166" y="16" width="138" height="46" rx="9" fill="#152119" stroke="#4cc26b" stroke-width="1.5"/>
  <text x="235" y="35" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" font-weight="800" fill="#4cc26b">RESELLABLE</text>
  <text x="235" y="51" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#d5cec7">Can mix &amp; resell</text>

  <!-- Bottom row: 3 Freshness pills -->
  <text x="160" y="82" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="700" fill="#6c655e">FRESHNESS / EXPIRY</text>
  <g font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" text-anchor="middle">
    <rect x="16" y="92" width="90" height="30" rx="8" fill="#231816" stroke="rgba(239,100,97,0.45)"/>
    <text x="61" y="111" fill="#ef6461">Temporary</text>

    <rect x="115" y="92" width="90" height="30" rx="8" fill="#221b14" stroke="rgba(247,153,27,0.45)"/>
    <text x="160" y="111" fill="#f7991b">Versioned</text>

    <rect x="214" y="92" width="90" height="30" rx="8" fill="#152119" stroke="rgba(76,194,107,0.45)"/>
    <text x="259" y="111" fill="#4cc26b">Evergreen</text>
  </g>
</svg>
