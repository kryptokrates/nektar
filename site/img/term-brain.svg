<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="One shared local AI brain connecting multiple AI apps on your computer">
  <title>Local AI Brain / Node</title>
  <rect width="320" height="140" rx="12" fill="#151211"/>
  <!-- Connecting lines -->
  <g stroke="#3a342f" stroke-width="2" stroke-dasharray="4 3">
    <line x1="76" y1="36" x2="140" y2="68"/>
    <line x1="76" y1="104" x2="140" y2="74"/>
    <line x1="244" y1="36" x2="180" y2="68"/>
    <line x1="244" y1="104" x2="180" y2="74"/>
  </g>
  <!-- 4 AI App nodes -->
  <g font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#f4efe6" text-anchor="middle">
    <rect x="18" y="20" width="66" height="28" rx="8" fill="#1e1a17" stroke="#3a342f"/>
    <text x="51" y="38">Claude</text>
    <rect x="18" y="92" width="66" height="28" rx="8" fill="#1e1a17" stroke="#3a342f"/>
    <text x="51" y="110">Cursor</text>
    <rect x="236" y="20" width="66" height="28" rx="8" fill="#1e1a17" stroke="#3a342f"/>
    <text x="269" y="38">Codex</text>
    <rect x="236" y="92" width="66" height="28" rx="8" fill="#1e1a17" stroke="#3a342f"/>
    <text x="269" y="110">OpenClaw</text>
  </g>
  <!-- Center Brain Vault -->
  <polygon points="160,34 194,52 194,88 160,106 126,88 126,52" fill="#211c18" stroke="#f7991b" stroke-width="2.2"/>
  <text x="160" y="68" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="800" fill="#f7991b">YOUR</text>
  <text x="160" y="83" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="800" fill="#f4efe6">BRAIN</text>
  <text x="160" y="128" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#958d85">100% on your own PC</text>
</svg>
