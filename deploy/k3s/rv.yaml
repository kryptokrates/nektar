# nektar rv fleet on k3s — StatefulSet: stable pod names, persistent state,
# self-discovering via beacons + headless service
# apply: kubectl apply -f rv.yaml
# scale: kubectl scale statefulset/nektar-rv --replicas=N
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nektar-rv
spec:
  serviceName: nektar-rv    # required for StatefulSet DNS identities
  replicas: 3
  selector: { matchLabels: { app: nektar-rv } }
  template:
    metadata: { labels: { app: nektar-rv } }
    spec:
      containers:
        - name: rv
          image: ghcr.io/kryptokrates/nektar-rv:latest   # the minimal rv image — no stark, no mcp
          env:
            # order matters — k8s expands dependent vars in declaration order
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: NEKTAR_OVERLAY_HOST, value: "0.0.0.0" }
            - { name: NEKTAR_OVERLAY_PORT, value: "8090" }
            - { name: NEKTAR_NETWORK, value: "testnet" }
            - { name: NEKTAR_RV_URL, value: "http://$(POD_IP):8090" }
            # stable ordinal identity — nektar-rv-0.nektar-rv exists because StatefulSet names pods that way
            - { name: NEKTAR_PEERS, value: "http://nektar-rv-0.nektar-rv:8090" }
            - { name: NEKTAR_OVERLAY_DIR, value: "/data" }
          ports: [{ containerPort: 8090 }]
          readinessProbe: { httpGet: { path: /peers, port: 8090 }, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /peers, port: 8090 }, periodSeconds: 30 }
          resources: { requests: { cpu: "100m", memory: "256Mi" }, limits: { memory: "1Gi" } }
          volumeMounts: [{ name: rv-data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: rv-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
---
# headless service — the mesh discovers pods directly, not through a VIP
apiVersion: v1
kind: Service
metadata: { name: nektar-rv }
spec:
  clusterIP: None      # headless: DNS returns the pod IPs for beacon peer-listing
  selector: { app: nektar-rv }
  ports: [{ port: 8090, targetPort: 8090 }]
