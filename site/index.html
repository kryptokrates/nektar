<html lang="en">
  <head>
    <meta charset="utf-8" />

    <link rel="alternate" type="text/plain" href="./llm.txt" title="LLM Agent Bootstrap Guide" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #161413;
        --card: #110f0e;
        --card-hover: #1b1816;
        --line: #282421;
        --line2: #3a342f;
        --ink: #f4efe6;
        --mut: #958d85;
        --mut2: #6c655e;
        --orange1: #f7991b;
        --orange2: #e86a0c;
        --ok: #4cc26b;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      a { color: inherit; text-decoration: none; }

      header {
        width: 100%;
        max-width: 1240px;
        margin: 0 auto;
        padding: 16px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: var(--ink);
      }
      .brand img { width: 26px; height: 26px; border-radius: 6px; }
      .mid-nav {
        display: flex;
        align-items: center;
        gap: 28px;
        font-size: 13.5px;
        font-weight: 600;
      }
      .mid-nav a {
        color: var(--mut);
        padding: 6px 2px;
        border-bottom: 2px solid transparent;
        transition: color 0.14s;
      }
      .mid-nav a:hover { color: var(--ink); }
      .mid-nav a.on { color: var(--orange1); border-bottom-color: var(--orange1); }
      .cream-btn {
        background: var(--ink);
        color: #161413;
        border: 0;
        border-radius: 10px;
        padding: 9px 18px;
        font: inherit;
        font-size: 13.5px;
        font-weight: 700;
        cursor: pointer;
        transition: filter 0.14s, transform 0.1s;
      }
      .cream-btn:hover { filter: brightness(0.93); }
      .cream-btn:active { transform: scale(0.98); }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4px 24px 14px;
        text-align: center;
      }
      .hero-strip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 16px;
      }
      .emblem {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        background: #221e1d;
        border: 1px solid rgba(247, 153, 27, 0.30);
        box-shadow: 0 0 0 4px rgba(247, 153, 27, 0.08);
        overflow: hidden;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .emblem img { width: 100%; height: 100%; display: block; }
      h1 {
        margin: 0;
        font-size: clamp(22px, 2.6vw, 30px);
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1.1;
        color: var(--ink);
      }
      h1 span {
        background: linear-gradient(90deg, #ffac33 0%, #f7991b 50%, #ea680b 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* Inline Hero Video Stage */
      .stage {
        position: relative;
        width: min(900px, 100%);
        aspect-ratio: 16 / 9;
        border-radius: 18px;
        overflow: hidden;
        background: #0a0908;
        border: 1px solid var(--line2);
        box-shadow: 0 0 0 1px rgba(247, 153, 27, 0.14), 0 24px 64px rgba(0, 0, 0, 0.58);
        margin-bottom: 18px;
      }
      .stage video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        background: #0a0908;
      }
      .play-cover {
        position: absolute;
        inset: 0;
        border: 0;
        padding: 0;
        background: radial-gradient(circle at center, rgba(17, 15, 14, 0.25) 0%, rgba(17, 15, 14, 0.52) 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        cursor: pointer;
        transition: background 0.18s;
      }
      .play-cover:hover { background: radial-gradient(circle at center, rgba(17, 15, 14, 0.12) 0%, rgba(17, 15, 14, 0.38) 100%); }
      .play-cover.hidden { display: none; }
      .play-btn {
        width: 78px;
        height: 78px;
        border-radius: 999px;
        background: linear-gradient(135deg, #ffac33 0%, #ea680b 100%);
        color: #161413;
        display: grid;
        place-items: center;
        box-shadow: 0 0 0 10px rgba(247, 153, 27, 0.18), 0 16px 40px rgba(0, 0, 0, 0.6);
        transition: transform 0.16s;
      }
      .play-cover:hover .play-btn { transform: scale(1.07); }
      .play-btn svg { width: 30px; height: 30px; margin-left: 4px; }
      .play-cap {
        background: rgba(17, 15, 14, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: var(--ink);
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      /* 2 Clean Action Cards Below Video */
      .cards {
        width: min(900px, 100%);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        text-align: left;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        transition: border-color 0.16s, background 0.16s, transform 0.14s;
      }
      .card:hover {
        background: var(--card-hover);
        border-color: var(--line2);
        transform: translateY(-2px);
      }
      .cico {
        width: 48px;
        height: 48px;
        border-radius: 13px;
        background: #1a1715;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        color: var(--orange1);
        flex-shrink: 0;
      }
      .cico.green { color: var(--ok); }
      .cico svg { width: 24px; height: 24px; }
      .cbody { min-width: 0; flex: 1; }
      .card h3 {
        margin: 0 0 3px;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .ccta {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--mut);
      }
      .card:hover .ccta { color: var(--ink); }
      .ccta.ok { color: var(--ok); }

      .os-switch {
        display: inline-flex;
        gap: 6px;
        margin-top: 6px;
        font-size: 11px;
        color: var(--mut2);
      }
      .os-switch button {
        background: none;
        border: 0;
        padding: 2px 7px;
        border-radius: 6px;
        color: inherit;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .os-switch button.on {
        color: var(--orange1);
        background: rgba(247, 153, 27, 0.12);
      }

      /* Quiet Centered Bottom Bar */
      footer {
        width: 100%;
        max-width: 1240px;
        margin: 0 auto;
        padding: 10px 28px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .socials {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sico {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: var(--card);
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        color: var(--mut);
        font-family: ui-monospace, monospace;
        font-size: 11px;
        font-weight: 700;
        transition: color 0.14s, border-color 0.14s;
      }
      .sico:hover { color: var(--ink); border-color: var(--line2); }
      .sico.txt { width: auto; padding: 0 11px; }
      .sico svg { width: 15px; height: 15px; }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: var(--ink);
        color: #161413;
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.16s;
      }
      .toast.show { opacity: 1; }

      @media (max-width: 720px) {
        header { padding: 14px 18px; }
        .mid-nav { display: none; }
        .emblem { width: 56px; height: 56px; border-radius: 15px; }
        .cards { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="./index.html">
        <img src="./logo.svg?v=2" alt="nektar" />
        <span>NEKTAR.RUN</span>
      </a>
      <nav class="mid-nav" aria-label="Primary">
        <a class="on" href="./index.html">NEKTAR</a>
        <a href="./docs/index.html">MANUALS</a>
        <a href="./llm.txt">LLM.TXT</a>
      </nav>
      <a class="cream-btn" href="./docs/index.html">Get Started</a>
    </header>

    <main>
      <!-- Direct Inline 1-Minute Explainer Video -->
      <section class="stage" aria-label="Nektar 60-second overview video">
        <video id="hero-video" src="./demo.mp4?v=7" poster="./demo-poster.jpg?v=5" controls playsinline preload="none"></video>
        <button class="play-cover" id="play-cover" type="button" aria-label="Play 60-second video">
          <span class="play-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4" /></svg>
          </span>
        </button>
      </section>

      <!-- 2 Clean Action Cards -->
      <section class="cards" aria-label="Get started">
        <div class="card" id="card-install" role="button" tabindex="0">
          <div class="cico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 17 10 11 4 5" />
              <line x1="12" y1="19" x2="20" y2="19" />
            </svg>
          </div>
          <div class="cbody">
            <h3>Install Nektar</h3>
            <span class="ccta" id="inst-cta">Copy install command ›</span>
            <div class="os-switch" onclick="event.stopPropagation()">
              <button id="os-unix" type="button">Mac / Linux</button>
              <button id="os-win" type="button">Windows</button>
            </div>
          </div>
        </div>

        <a class="card" href="./docs/index.html">
          <div class="cico green">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="7" r="3" />
              <circle cx="6" cy="17" r="2.5" />
              <circle cx="18" cy="17" r="2.5" />
              <path d="M10.4 9.6L7.4 14.8M13.6 9.6l3 5.2M8.5 17h7" />
            </svg>
          </div>
          <div class="cbody">
            <h3>Connect Your AI</h3>
            <span class="ccta">Claude · Cursor · Codex · OpenClaw ›</span>
          </div>
        </a>
      </section>
    </main>

    <footer>
      <div class="socials">
        <a class="sico" href="https://x.com/nektardotrun" target="_blank" rel="noopener" title="Follow @nektardotrun on X" aria-label="X">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" /></svg>
        </a>
        <a class="sico" href="https://github.com/kryptokrates/nektar" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5A11.5 11.5 0 0 0 .5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2c-3.2.7-3.87-1.54-3.87-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.04 11.04 0 0 1 5.8 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.42-2.7 5.39-5.27 5.68.42.36.79 1.07.79 2.15v3.19c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5z" /></svg>
        </a>
        <a class="sico" href="./docs/index.html" title="Instruction Manuals" aria-label="Manuals">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></svg>
        </a>
        <a class="sico txt" href="./llm.txt" title="Agent Bootstrap Guide">llm.txt</a>
      </div>
    </footer>

    <div class="toast" id="toast" role="status"></div>

    <script>
      const CMDS = {
        unix: 'curl -fsSL https://raw.githubusercontent.com/kryptokrates/nektar/master/install/install.sh | sh -s -- --up',
        win: '& ([scriptblock]::Create((irm https://raw.githubusercontent.com/kryptokrates/nektar/master/install/install.ps1))) -Up'
      }
      let os = /Win/i.test(navigator.platform || navigator.userAgent) ? 'win' : 'unix'
      const btnUnix = document.getElementById('os-unix')
      const btnWin = document.getElementById('os-win')
      const instCta = document.getElementById('inst-cta')
      const toastEl = document.getElementById('toast')
      let toastT = null

      function showToast(msg) {
        toastEl.textContent = msg
        toastEl.classList.add('show')
        if (toastT) clearTimeout(toastT)
        toastT = setTimeout(() => toastEl.classList.remove('show'), 2200)
      }
      function syncOs() {
        btnUnix.classList.toggle('on', os === 'unix')
        btnWin.classList.toggle('on', os === 'win')
      }
      btnUnix.onclick = () => { os = 'unix'; syncOs(); copyInstall() }
      btnWin.onclick = () => { os = 'win'; syncOs(); copyInstall() }
      syncOs()

      async function copyInstall() {
        await navigator.clipboard.writeText(CMDS[os]).catch(() => {})
        instCta.textContent = 'Copied! Paste in terminal ✓'
        instCta.classList.add('ok')
        showToast(os === 'win' ? 'Copied PowerShell install command ✓' : 'Copied install command ✓')
        setTimeout(() => {
          instCta.textContent = 'Copy install command ›'
          instCta.classList.remove('ok')
        }, 2000)
      }
      const cardInstall = document.getElementById('card-install')
      cardInstall.onclick = copyInstall
      cardInstall.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copyInstall() } }

      // Inline Hero Video Player
      const video = document.getElementById('hero-video')
      const cover = document.getElementById('play-cover')
      cover.onclick = () => {
        cover.classList.add('hidden')
        video.play().catch(() => {})
      }
      video.addEventListener('play', () => cover.classList.add('hidden'))
    </script>
  </body>
</html>
