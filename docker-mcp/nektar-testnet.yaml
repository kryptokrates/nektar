name: nektar-testnet
title: nektar on BSV testnet (test coins)
type: server
image: nektar:local
description: >-
  nektar on the public BSV testnet via BSV Broadcaster + WhatsOnChain. Anchor fees are
  paid by a dedicated operator fee key (generated on first start; its address is
  printed to stderr — fund it with testnet coins). All broadcasts pass a SpendGuard
  (per-tx fee cap, per-day spend cap, min interval, persisted ledger). Keys are
  encrypted at rest (NEKTAR_KEY_PASSPHRASE). Testnet coins have no monetary value.
longLived: true
volumes:
  - nektar-testnet-data:/data
secrets:
  - name: nektar-testnet.key_passphrase
    env: NEKTAR_KEY_PASSPHRASE
    example: <long random passphrase>
    description: Encrypts keys.json and fee.key.json at rest (required)
  - name: nektar-testnet.broadcaster_api_key
    env: NEKTAR_BROADCASTER_API_KEY
    example: <broadcaster api key — optional>
    description: BSV Broadcaster API key (optional; public endpoints work without one)
  - name: nektar-testnet.fund_wif
    env: NEKTAR_FUND_WIF
    example: <testnet WIF — optional>
    description: Operator fee key as testnet WIF. If unset, a fee.key.json key is generated.
env:
  - name: NEKTAR_NETWORK
    value: testnet
  - name: NEKTAR_MAX_FEE_SATS_PER_TX
    value: '{{nektar-testnet.max_fee_sats_per_tx}}'
  - name: NEKTAR_MAX_SPEND_SATS_PER_DAY
    value: '{{nektar-testnet.max_spend_sats_per_day}}'
  - name: NEKTAR_MIN_BROADCAST_INTERVAL_MS
    value: '{{nektar-testnet.min_broadcast_interval_ms}}'
  - name: NEKTAR_MODEL_ID
    value: '{{nektar-testnet.model_id}}'
  - name: NEKTAR_CLEARANCE_AUTHORITIES
    value: '{{nektar-testnet.clearance_authorities}}'
config:
  - name: nektar-testnet
    description: BSV testnet deployment — test coins only
    type: object
    properties:
      max_fee_sats_per_tx:
        type: integer
        description: Per-transaction fee cap in sats (default 1000)
      max_spend_sats_per_day:
        type: integer
        description: Daily fee spend cap in sats, UTC day (default 20000)
      min_broadcast_interval_ms:
        type: integer
        description: Minimum ms between broadcasts (default 10000)
      model_id:
        type: string
        description: Exact model identity bound into answer receipts
      clearance_authorities:
        type: string
        description: Comma-separated pubkeys trusted to issue clearance credentials (level > 0 reads)
