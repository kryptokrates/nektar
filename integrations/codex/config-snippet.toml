# merge into ~/.codex/config.toml

# ── nektar v0.1 MCP server (native Go binary — auto-bridges to running `nektar serve` daemon!) ──
# Start the daemon once:  nektar serve   (listens on http://127.0.0.1:18420)
# Or use stdio directly (zero SQLite lock contention when daemon is running):
[mcp_servers.nektar]
command = "nektar"
args = ["mcp"]

# Alternatively, connect directly over Streamable HTTP MCP:
# [mcp_servers.nektar]
# url = "http://127.0.0.1:18420/mcp"

# ── turn-complete receipt verification (native Go hook — zero Node.js!) ──
notify = ["nektar", "hook", "verify-receipt"]
