[package]
name = "mamem-stark-verifier"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
risc0-zkvm = { version = "=3.0.3", default-features = false }
wasm-bindgen = "=0.2.100"
bincode = "1"
hex = "0.4"
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "z"
lto = true
