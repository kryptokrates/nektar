<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="A Hub is a public bulletin board connecting agents behind home Wi-Fi without seeing private keys">
  <title>Hub — Public Bulletin Board</title>
  <rect width="320" height="140" rx="12" fill="#151211"/>
  <!-- Connection arcs -->
  <line x1="62" y1="74" x2="132" y2="54" stroke="#f7991b" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="258" y1="74" x2="188" y2="54" stroke="#4cc26b" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="160" y1="80" x2="160" y2="104" stroke="#78b4ff" stroke-width="1.8" stroke-dasharray="4 3"/>

  <!-- Center Hub -->
  <rect x="128" y="24" width="64" height="54" rx="11" fill="#231c15" stroke="#f7991b" stroke-width="2"/>
  <text x="160" y="49" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11.5" font-weight="900" fill="#f7991b">HUB</text>
  <text x="160" y="65" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#d5cec7">Relay only</text>

  <!-- 3 Agent nodes -->
  <g font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#f4efe6" text-anchor="middle">
    <rect x="18" y="60" width="62" height="30" rx="8" fill="#1e1a17" stroke="#3a342f"/>
    <text x="49" y="79">Agent A</text>

    <rect x="240" y="60" width="62" height="30" rx="8" fill="#1e1a17" stroke="#3a342f"/>
    <text x="271" y="79">Agent B</text>

    <rect x="124" y="102" width="72" height="26" rx="8" fill="#1e1a17" stroke="#3a342f"/>
    <text x="160" y="119">Agent C</text>
  </g>
  <text x="50" y="116" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#6c655e">No keys stored</text>
  <text x="270" y="116" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#6c655e">Works on Wi-Fi</text>
</svg>
