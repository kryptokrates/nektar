name: ci
on:
  push:
    branches: [master, main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: architectural fitness checks
        run: |
          set -euo pipefail
          # 1. Verify Rúnar compiled contract artifacts match embedded binary copies byte-for-byte.
          for f in internal/contracts/artifacts/*.json; do
            base="$(basename "$f")"
            if [ -f "contracts/artifacts/$base" ]; then
              diff -u "contracts/artifacts/$base" "$f"
            fi
          done
          # 2. Verify no raw ec.PrivateKey references leak into server/hub/memory/store/chain/policy/core/cmd.
          bad="$(grep -rn 'ec\.PrivateKey' internal/ cmd/ --include='*.go' --exclude='*_test.go' \
            | grep -vE '^internal/(wallet|bstack|contracts|discovery|market)/' \
            | grep -v '^internal/reasoning/grounding\.go:' || true)"
          if [ -n "$bad" ]; then
            echo "ERROR: raw ec.PrivateKey found outside allowed signing/custody packages:"
            echo "$bad"
            exit 1
          fi
      - name: unit & integration tests (race detector)
        run: go test -race -v ./...
      - name: static cross-compile smoke (CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/nektar-linux ./cmd/nektar
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/nektar-darwin ./cmd/nektar
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/nektar-win.exe ./cmd/nektar
          /tmp/nektar-linux version

  crypto-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Rúnar Go covenants compile & unit tests
        working-directory: contracts
        run: |
          CGO_ENABLED=0 go test -v ./...
          CGO_ENABLED=0 go run ./cmd/compile -prototypes
      - name: Verify compiled artifacts match committed copies
        run: git diff -I '"buildTimestamp":' --exit-code contracts/artifacts/ internal/contracts/artifacts/
      - name: Crypto hardening & ASM invariant tests
        run: |
          go test -v ./internal/core -run 'TestWycheproof|TestHDPV2|TestCanonicalJSON|TestMerkleHardening'
          go test -v ./internal/contracts -run 'TestCovenantASMInvariants|TestVerifyGrothClaimSettlement|TestOfferDigestV2'
          go test -v ./internal/bstack -run 'TestBboxE2E|TestArtifactDomain|TestBorgGroup'
          go test -v ./internal/reasoning -run 'TestDelegationAndReceiptHardening'
          go test -v ./internal/policy -run 'TestDecisionReceiptSigning'
          go test -v ./internal/memory -run 'TestHardeningEncryptedLeaf|TestShardPackRejects'
      - name: Fuzz smoke (3s each)
        run: |
          go test ./internal/core -fuzz=FuzzParseFragment -fuzztime=3s
          go test ./internal/bstack -fuzz=FuzzOpenBboxBody -fuzztime=3s
          go test ./internal/contracts -fuzz=FuzzVerifyFragment -fuzztime=3s
      - name: Static crypto pre-scanner & unit tests
        run: |
          node --test .devin/skills/crypto-audit/scripts/crypto-scan.test.mjs
          node .devin/skills/crypto-audit/scripts/crypto-scan.mjs contracts/src --no-probe
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: build Svelte 5 dashboard
        working-directory: ui
        run: npm install --no-audit --no-fund && npm run build
      - name: verify embedded UI parity (ui/dist vs internal/server/ui_dist)
        run: |
          set -euo pipefail
          if ! diff -rq ui/dist internal/server/ui_dist; then
            echo "ERROR: internal/server/ui_dist is out of sync with ui/dist — rebuild UI and sync ui/dist/ -> internal/server/ui_dist/"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: build v0.1 single-binary image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: nektar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke — binary executes cleanly
        run: docker run --rm nektar:ci version
