name: nektar-regtest
title: nektar — verifiable agent memory (local regtest)
type: server
image: ghcr.io/kryptokrates/nektar:latest
command:
  - mcp
longLived: true
volumes:
  - nektar-regtest-data:/data
description: >-
  Local BSV regtest / memory deployment for development and offline testing.
env:
  - name: NEKTAR_NETWORK
    value: memory
  - name: NEKTAR_TOOL_PROFILE
    value: operator
