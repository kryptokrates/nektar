<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="Sellers post a bond deposit, earn a 6-sided reputation score, and PII gate blocks secrets automatically">
  <title>Bond, 6D Reputation, and PII Gate</title>
  <rect width="320" height="140" rx="12" fill="#151211"/>
  <!-- Left: Bond Deposit -->
  <rect x="14" y="20" width="88" height="96" rx="10" fill="#221b14" stroke="#f7991b" stroke-width="1.5"/>
  <circle cx="58" cy="52" r="16" fill="rgba(247,153,27,0.18)" stroke="#f7991b" stroke-width="1.6"/>
  <text x="58" y="57" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="900" fill="#f7991b">₿</text>
  <text x="58" y="84" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" font-weight="800" fill="#f4efe6">BOND</text>
  <text x="58" y="100" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#958d85">Deposit</text>

  <!-- Center: 6D Reputation Hex -->
  <rect x="112" y="20" width="96" height="96" rx="10" fill="#152119" stroke="#4cc26b" stroke-width="1.5"/>
  <polygon points="160,32 182,44 182,68 160,80 138,68 138,44" fill="rgba(76,194,107,0.18)" stroke="#4cc26b" stroke-width="1.8"/>
  <text x="160" y="60" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="900" fill="#4cc26b">6D</text>
  <text x="160" y="96" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" font-weight="800" fill="#f4efe6">SCORE</text>
  <text x="160" y="109" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="8.5" fill="#ef6461">Auto-slash fakes</text>

  <!-- Right: PII Gate -->
  <rect x="218" y="20" width="88" height="96" rx="10" fill="#231616" stroke="rgba(239,100,97,0.55)" stroke-width="1.5"/>
  <rect x="230" y="42" width="64" height="20" rx="5" fill="#161413" stroke="#ef6461"/>
  <text x="262" y="55" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="800" fill="#ef6461">sk-•••• ✕</text>
  <text x="262" y="84" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" font-weight="800" fill="#f4efe6">PII GATE</text>
  <text x="262" y="100" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#958d85">Blocks secrets</text>
</svg>
