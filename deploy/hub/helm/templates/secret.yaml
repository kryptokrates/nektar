{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nektar-hub.fullname" . }}
  labels:
    {{- include "nektar-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEKTAR_KEY_PASSPHRASE: {{ required "secrets.keyPassphrase is required (or set secrets.existingSecret)" .Values.secrets.keyPassphrase | quote }}
  NEKTAR_HTTP_TOKEN: {{ required "secrets.httpToken is required (or set secrets.existingSecret)" .Values.secrets.httpToken | quote }}
  NEKTAR_FUND_WIF: {{ .Values.secrets.fundWif | quote }}
  OVERLAY_DB_PASSWORD: {{ required "secrets.overlayDbPassword is required (or set secrets.existingSecret)" .Values.secrets.overlayDbPassword | quote }}
  OVERLAY_ADMIN_TOKEN: {{ required "secrets.overlayAdminToken is required (or set secrets.existingSecret)" .Values.secrets.overlayAdminToken | quote }}
{{- end }}
