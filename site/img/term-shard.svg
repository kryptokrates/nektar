<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="Shards are locked topic folders private by default unless explicitly listed for sale">
  <title>Shard — Locked Topic Folder</title>
  <rect width="320" height="140" rx="12" fill="#151211"/>
  <!-- Private Folder -->
  <path d="M26 42 h40 l10 10 h66 a8 8 0 0 1 8 8 v44 a8 8 0 0 1 -8 8 H26 a8 8 0 0 1 -8 -8 V50 a8 8 0 0 1 8 -8 Z" fill="#1e1a17" stroke="#3a342f" stroke-width="1.8"/>
  <text x="34" y="74" font-family="ui-monospace,monospace" font-size="12" font-weight="800" fill="#f4efe6">#private</text>
  <!-- Lock icon -->
  <path d="M122 72 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#958d85" stroke-width="2"/>
  <rect x="119" y="72" width="18" height="14" rx="3" fill="#958d85"/>
  <text x="34" y="96" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" fill="#958d85">Stays on your PC</text>

  <!-- Listed Folder -->
  <path d="M178 42 h40 l10 10 h66 a8 8 0 0 1 8 8 v44 a8 8 0 0 1 -8 8 H178 a8 8 0 0 1 -8 -8 V50 a8 8 0 0 1 8 -8 Z" fill="#211b16" stroke="#f7991b" stroke-width="1.8"/>
  <text x="186" y="74" font-family="ui-monospace,monospace" font-size="12" font-weight="800" fill="#f7991b">#ops-tips</text>
  <rect x="242" y="62" width="46" height="18" rx="9" fill="rgba(247,153,27,0.2)"/>
  <text x="265" y="74" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" font-weight="800" fill="#f7991b">SELL</text>
  <text x="186" y="96" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" fill="#d5cec7">Only if you opt in</text>
  <text x="160" y="128" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6c655e">Git-versioned · Encrypted at rest</text>
</svg>
