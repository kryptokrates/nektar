# OPS-003 Prometheus alert rules for nektar v0.4 (scrape GET /v1/metrics).
# Every metric name referenced below is verified by TestMetricsAlertsParity in internal/server.
groups:
  - name: nektar
    rules:
      - alert: NektarPendingAnchorsStuck
        expr: nektar_pending_anchors > 0
        for: 10m
        labels: { severity: critical }
        annotations: { summary: 'in-flight anchor batch stuck in pending_anchors — check broadcaster and wallet recovery' }
      - alert: NektarUnsettledAnchorsHigh
        expr: nektar_unsettled_anchors > 50
        for: 15m
        labels: { severity: warning }
        annotations: { summary: 'many broadcast anchors without a mined BUMP — mining stalled or header sync delayed' }
      - alert: NektarUnsettledAnchorsSpike
        expr: delta(nektar_unsettled_anchors[5m]) > 10
        labels: { severity: warning }
        annotations: { summary: 'unsettled anchors jumped sharply — verify broadcaster/proof refresh health' }
      - alert: NektarUnanchoredBacklog
        expr: nektar_unanchored_fragments > 500
        for: 30m
        labels: { severity: warning }
        annotations: { summary: 'unanchored fragment backlog growing — check anchor cadence and wallet balance' }
      - alert: NektarFeeBalanceLow
        expr: nektar_fee_balance_sats < 5000
        for: 30m
        labels: { severity: warning }
        annotations: { summary: 'wallet fee balance below 5,000 sats — top up the node funding address' }
      - alert: NektarWalletUTXOsDepleted
        expr: nektar_wallet_utxos < 2
        for: 15m
        labels: { severity: warning }
        annotations: { summary: 'wallet has fewer than 2 spendable UTXOs — concurrent anchoring/trading may contend' }
      - alert: NektarSpendGuardNearDailyCap
        expr: nektar_spend_guard_daily_cap_sats > 0 and (nektar_spend_guard_spent_sats / nektar_spend_guard_daily_cap_sats) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations: { summary: 'SpendGuard daily satoshi budget is >90% consumed' }
      - alert: NektarRestateDetached
        expr: nektar_restate_attached == 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: 'Restate durable execution plane is detached — live market trades will refuse to execute' }
      - alert: NektarRestartLoop
        expr: changes(nektar_uptime_seconds[15m]) > 0 and nektar_uptime_seconds < 60
        for: 5m
        labels: { severity: critical }
        annotations: { summary: 'nektar daemon restarted repeatedly within 15m' }
