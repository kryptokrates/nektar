<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="Three ways to buy knowledge: Spot one-time pack, Per-Query pay per search, or Live Feed subscription">
  <title>3 Buying Modes: Spot, Per-Query, Feed</title>
  <rect width="320" height="140" rx="12" fill="#151211"/>
  <!-- Spot -->
  <rect x="14" y="20" width="90" height="100" rx="10" fill="#1e1a17" stroke="#4cc26b" stroke-width="1.5"/>
  <rect x="44" y="34" width="30" height="26" rx="6" fill="rgba(76,194,107,0.16)" stroke="#4cc26b" stroke-width="1.6"/>
  <text x="59" y="51" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="900" fill="#4cc26b">1×</text>
  <text x="59" y="82" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="800" fill="#f4efe6">SPOT</text>
  <text x="59" y="100" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#958d85">Buy once</text>

  <!-- Per-Query -->
  <rect x="115" y="20" width="90" height="100" rx="10" fill="#161d26" stroke="#78b4ff" stroke-width="1.5"/>
  <circle cx="157" cy="45" r="10" fill="none" stroke="#78b4ff" stroke-width="2.2"/>
  <line x1="164" y1="52" x2="172" y2="60" stroke="#78b4ff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="160" y="82" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" font-weight="800" fill="#f4efe6">PER-QUERY</text>
  <text x="160" y="100" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#958d85">Pay per ask</text>

  <!-- Feed -->
  <rect x="216" y="20" width="90" height="100" rx="10" fill="#241b13" stroke="#f7991b" stroke-width="1.6"/>
  <circle cx="261" cy="52" r="4.5" fill="#f7991b"/>
  <path d="M251 44 a14 14 0 0 1 20 0" fill="none" stroke="#f7991b" stroke-width="2" stroke-linecap="round"/>
  <path d="M245 38 a22 22 0 0 1 32 0" fill="none" stroke="#f7991b" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
  <text x="261" y="82" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="800" fill="#f7991b">FEED</text>
  <text x="261" y="100" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#d5cec7">Live updates</text>
</svg>
