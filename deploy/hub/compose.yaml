# Nektar v0.1 Hub — Single static Pure-Go binary hosting:
#   - Nektar Agent (MCP + HTTP + A2A + L0 LLM Proxy + Svelte 5 Dashboard + embedded go-workflows SQLite WAL)
#   - Embedded Go Overlay Hub (BRC-223 topics, ls_nektar, bfinger, bbox, blogs, borg, bsecret, bstore)
#   - Native SSE /hub/events push, curated starter liquidity, verified bounties & testnet faucet
#
#   docker compose -f deploy/hub/compose.yaml up -d
#   docker compose -f deploy/hub/compose.yaml --profile tls up -d
#   docker compose -f deploy/hub/compose.yaml --profile tls --profile tunnel up -d
name: nektar-hub
services:
  hub:
    image: ghcr.io/kryptokrates/nektar:${NEKTAR_IMAGE_TAG:-latest}${NEKTAR_IMAGE_DIGEST:+@${NEKTAR_IMAGE_DIGEST}}
    restart: unless-stopped
    command: ['serve', '-listen', ':18420', '-hub']
    ports:
      - '${NEKTAR_HTTP_BIND:-127.0.0.1}:${NEKTAR_HTTP_PORT:-18420}:18420'
    environment:
      NEKTAR_NETWORK: ${NEKTAR_NETWORK:-testnet}
      NEKTAR_DATA_DIR: /data
      NEKTAR_HTTP_PORT: '18420'
      NEKTAR_CONTAINER: '1'
      NEKTAR_EMBED_HUB: '1'
      NEKTAR_PUBLIC_URL: ${NEKTAR_PUBLIC_URL:-}
      NEKTAR_TRUST_PROXY: ${NEKTAR_TRUST_PROXY:-0}
      NEKTAR_HTTP_TOKEN: ${NEKTAR_HTTP_TOKEN:-}
      NEKTAR_OPERATOR_TOKEN: ${NEKTAR_OPERATOR_TOKEN:-}
      NEKTAR_MARKET_HOSTS: ${NEKTAR_MARKET_HOSTS:-}
      NEKTAR_HUB_TRANSPORT: ${NEKTAR_HUB_TRANSPORT:-relay}
      NEKTAR_UPSTREAM_SPINES: ${NEKTAR_UPSTREAM_SPINES:-}
      NEKTAR_CATCHUP_PEERS: ${NEKTAR_CATCHUP_PEERS:-}
      NEKTAR_SPINE_PEER_PUBS: ${NEKTAR_SPINE_PEER_PUBS:-}
      NEKTAR_HUB_ROLE: ${NEKTAR_HUB_ROLE:-leaf}
      NEKTAR_HUB_FEE_PRESET: ${NEKTAR_HUB_FEE_PRESET:-free}
      NEKTAR_HUB_SUBMIT_WANT_SATS: ${NEKTAR_HUB_SUBMIT_WANT_SATS:-}
      NEKTAR_HUB_SUBMIT_OFFER_SATS: ${NEKTAR_HUB_SUBMIT_OFFER_SATS:-}
      NEKTAR_HUB_SUBMIT_ANNOUNCE_SATS: ${NEKTAR_HUB_SUBMIT_ANNOUNCE_SATS:-}
      NEKTAR_HUB_BBOX_SEND_SATS: ${NEKTAR_HUB_BBOX_SEND_SATS:-}
      NEKTAR_HUB_EGRESS_SATS_PER_100: ${NEKTAR_HUB_EGRESS_SATS_PER_100:-}
      NEKTAR_HUB_EGRESS_MIN_TOPUP_SATS: ${NEKTAR_HUB_EGRESS_MIN_TOPUP_SATS:-}
      NEKTAR_HUB_LOOKUP_PRICES: ${NEKTAR_HUB_LOOKUP_PRICES:-}
      NEKTAR_SEED_DOMAINS: ${NEKTAR_SEED_DOMAINS:-}
      NEKTAR_TOOL_PRICES: ${NEKTAR_TOOL_PRICES:-}
      NEKTAR_HUB_RESALE_SATS: ${NEKTAR_HUB_RESALE_SATS:-}
      NEKTAR_FAUCET_DAILY_CAP: ${NEKTAR_FAUCET_DAILY_CAP:-50000}
      NEKTAR_HEADERS_SOURCE: ${NEKTAR_HEADERS_SOURCE:-}
      NEKTAR_SETTLE_SPEC: ${NEKTAR_SETTLE_SPEC:-}
      NEKTAR_ARCADE_KEY: ${NEKTAR_ARCADE_KEY:-}
      NEKTAR_WOC_KEY: ${NEKTAR_WOC_KEY:-}
      NEKTAR_SETTLE_DEPTH: ${NEKTAR_SETTLE_DEPTH:-}
      NEKTAR_WALLET_PROFILE: ${NEKTAR_WALLET_PROFILE:-standard}
      NEKTAR_OPERATOR_PUBKEY: ${NEKTAR_OPERATOR_PUBKEY:-}
      NEKTAR_NTP_SERVERS: ${NEKTAR_NTP_SERVERS:-}
      NEKTAR_BACKUP_DIR: ${NEKTAR_BACKUP_DIR:-/backups}
      NEKTAR_BACKUP_INTERVAL: ${NEKTAR_BACKUP_INTERVAL:-6h}
      NEKTAR_BACKUP_KEEP: ${NEKTAR_BACKUP_KEEP:-14}
      NEKTAR_BACKUP_S3_BUCKET: ${NEKTAR_BACKUP_S3_BUCKET:-}
      NEKTAR_BACKUP_S3_ENDPOINT: ${NEKTAR_BACKUP_S3_ENDPOINT:-}
      NEKTAR_BACKUP_S3_REGION: ${NEKTAR_BACKUP_S3_REGION:-}
      NEKTAR_BACKUP_S3_PREFIX: ${NEKTAR_BACKUP_S3_PREFIX:-}
      NEKTAR_BACKUP_S3_ACCESS_KEY: ${NEKTAR_BACKUP_S3_ACCESS_KEY:-}
      NEKTAR_BACKUP_S3_SECRET_KEY: ${NEKTAR_BACKUP_S3_SECRET_KEY:-}
      NEKTAR_MAX_FEE_PER_TX: ${NEKTAR_MAX_FEE_PER_TX:-10000}
      NEKTAR_MAX_SPEND_PER_DAY: ${NEKTAR_MAX_SPEND_PER_DAY:-100000}
      NEKTAR_MAINNET_CONFIRM: ${NEKTAR_MAINNET_CONFIRM:-}
      BBOX_OFFICES: ${BBOX_OFFICES:-}
      BLOGS_STREAMS: ${BLOGS_STREAMS:-}
      BORG_HALLS: ${BORG_HALLS:-}
      BSECRET_CRYPTS: ${BSECRET_CRYPTS:-}
      BSTORE_BUCKETS: ${BSTORE_BUCKETS:-}
    volumes:
      - hub-data:/data
      - hub-backups:/backups

  caddy:
    profiles: [tls]
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      NEKTAR_DOMAIN: ${NEKTAR_DOMAIN:-:80}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - hub

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2025.2.1
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', '--url', 'http://hub:18420']
    depends_on:
      - hub

  cloudflared-named:
    profiles: [tunnel-token]
    image: cloudflare/cloudflared:2025.2.1
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - hub

configs:
  caddyfile:
    content: |
      {$NEKTAR_DOMAIN::80} {
        reverse_proxy hub:18420 {
          flush_interval -1
        }
      }

volumes:
  hub-data: {}
  hub-backups: {}
  caddy-data: {}
  caddy-config: {}
