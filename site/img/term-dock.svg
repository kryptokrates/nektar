<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="One-click dock connecting Nektar into an AI app">
  <title>Dock Your AI</title>
  <rect width="320" height="140" rx="12" fill="#151211"/>
  <!-- Left: Nektar plug -->
  <rect x="26" y="46" width="84" height="48" rx="10" fill="#211c18" stroke="#f7991b" stroke-width="2"/>
  <text x="68" y="74" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="800" fill="#f7991b">NEKTAR</text>
  <!-- Plug prongs -->
  <rect x="110" y="59" width="18" height="6" rx="2" fill="#f7991b"/>
  <rect x="110" y="75" width="18" height="6" rx="2" fill="#f7991b"/>
  <!-- Snap Arrow -->
  <line x1="136" y1="70" x2="174" y2="70" stroke="#4cc26b" stroke-width="2.5" stroke-dasharray="4 3"/>
  <polygon points="172,64 184,70 172,76" fill="#4cc26b"/>
  <!-- Right: AI App socket -->
  <rect x="190" y="40" width="104" height="60" rx="12" fill="#1e1a17" stroke="#4cc26b" stroke-width="1.8"/>
  <text x="242" y="65" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="800" fill="#f4efe6">AI APP</text>
  <rect x="210" y="74" width="64" height="17" rx="8.5" fill="rgba(76,194,107,0.16)"/>
  <text x="242" y="86" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" font-weight="800" fill="#4cc26b">DOCKED ✓</text>
  <text x="160" y="124" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#958d85">nektar up  ·  undo anytime</text>
</svg>
