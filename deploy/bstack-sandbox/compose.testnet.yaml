# Two real reference hosts on public BSV testnet (Phase 4b).
# Standalone project: `docker compose -p nektar-bstack-testnet -f deploy/bstack-sandbox/compose.testnet.yaml up -d`
# The shim (SHIM_MODE=live) serves the hosts' tracker calls from the testnet
# broadcaster's chaintracks + WoC test, and its asset calls from the
# broadcaster's /tx merklePath + WoC /spent reads — no Teranode involved.
name: nektar-bstack-testnet
services:
  db:
    image: mysql@sha256:df90258da46f6e7ff8574ff84f17618aba0765cac749928299c69fd4e7cb8ad8
    environment:
      MYSQL_DATABASE: overlay
      MYSQL_USER: overlay
      MYSQL_PASSWORD: spike
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    command: ['--innodb-buffer-pool-size=128M', '--performance-schema=OFF']
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uoverlay -pspike --silent']
      interval: 3s
      timeout: 2s
      retries: 40
    volumes:
      - db:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
  shim:
    image: node:22-alpine
    working_dir: /shim
    command: ['node', 'header-shim.mjs']
    environment:
      SHIM_PORT: 8080
      SHIM_MODE: live
      SHIM_BROADCASTER: https://arcade-v2-testnet-us-1.bsvblockchain.tech
      SHIM_WOC: https://api.whatsonchain.com/v1/bsv/test
      SHIM_CHAINTRACKS: https://arcade-v2-testnet-us-1.bsvblockchain.tech/chaintracks/v2
    volumes:
      - ./header-shim.mjs:/shim/header-shim.mjs:ro
  host-a: &host
    image: ghcr.io/lightwebinc/bbox-host@sha256:9e3579b24e35e853df3cf194bee33a1355e17f3c480fb0ccf9e17cd13997d0df
    depends_on:
      db:
        condition: service_healthy
      shim:
        condition: service_started
    environment: &hostenv
      BBOX_OFFICES: nektar_abcdefghij
      BLOGS_STREAMS: nektar_abcdefghij=open
      BLOGS_STATE_DIR: /var/lib/bbox/blogs
      BLOGS_KEEP_DAYS: 90
      OVERLAY_TOPICS: tm_bbox_nektar_abcdefghij,tm_log_nektar_abcdefghij,tm_finger,tm_nektar_testnet_0,tm_nektar_testnet_1,tm_nektar_testnet_2,tm_nektar_testnet_3,tm_nektar_testnet_4,tm_nektar_testnet_5,tm_nektar_testnet_6,tm_nektar_testnet_7,tm_nektar_testnet_8,tm_nektar_testnet_9,tm_nektar_testnet_a,tm_nektar_testnet_b,tm_nektar_testnet_c,tm_nektar_testnet_d,tm_nektar_testnet_e,tm_nektar_testnet_f
      OVERLAY_MODULES: /app/modules/bbox/bbox-module.js,/app/modules/nektar/nektar-module.js,/app/modules/blogs/blogs-module.js,/app/modules/finger/finger-module.js
      OVERLAY_CHAIN_TRACKER_URL: http://shim:8080
      BBOX_ASSET_URL: http://shim:8080
      OVERLAY_ADMIN_TOKEN: spike-token
      NEKTAR_NETS: testnet
      OVERLAY_KNEX_URL: mysql://overlay:spike@db:3306/overlay
    volumes:
      - ../../packages/bstack/bundle:/app/modules/nektar:ro
      - ./modules/blogs:/app/modules/blogs:ro
      - ./modules/finger:/app/modules/finger:ro
      - host-state-a:/var/lib/bbox
    ports:
      - '127.0.0.1:18291:8080'
  host-b:
    <<: *host
    environment:
      <<: *hostenv
      OVERLAY_KNEX_URL: mysql://overlay:spike@db:3306/overlay_b
    volumes:
      - ../../packages/bstack/bundle:/app/modules/nektar:ro
      - ./modules/blogs:/app/modules/blogs:ro
      - ./modules/finger:/app/modules/finger:ro
      - host-state-b:/var/lib/bbox
    ports:
      - '127.0.0.1:18292:8080'
volumes:
  db: {}
  host-state-a: {}
  host-state-b: {}
