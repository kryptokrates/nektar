{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nektar-hub.fullname" . }}
  labels:
    {{- include "nektar-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEKTAR_HTTP_TOKEN: {{ required "secrets.httpToken is required (or set secrets.existingSecret)" .Values.secrets.httpToken | quote }}
  NEKTAR_OPERATOR_TOKEN: {{ required "secrets.operatorToken is required (or set secrets.existingSecret)" .Values.secrets.operatorToken | quote }}
{{- end }}
