name: regtest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e-v04:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: vet & v0.1 Pure-Go end-to-end suite (race detector)
        run: |
          go vet ./...
          go test -race -v -count=1 ./internal/e2e/... ./internal/market/... ./internal/wallet/...
