name: release
on:
  push:
    branches: [master, main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # ghcr push
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nektar
          tags: |
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=nektar
            org.opencontainers.image.description=Verifiable, encrypted agent memory on BSV — MCP server
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: smoke the pushed image
        run: docker run --rm --entrypoint node ghcr.io/${{ github.repository_owner }}/nektar:${{ github.ref_type == 'tag' && 'latest' || 'edge' }} demo/client.mjs
        timeout-minutes: 3
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release upload on tags
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm
        run: corepack enable && corepack prepare pnpm@12.16.1 --activate
      - name: pnpm store cache
        # tag builds run uncached — a poisoned store would reach the release asset
        if: github.ref_type != 'tag'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
        timeout-minutes: 10
      - run: node tools/bundle-mcp.mjs
      - name: tar the self-contained bundle
        run: tar -czf nektar-mcp-bundle.tar.gz -C dist-bundle .
      - name: upload run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nektar-mcp-bundle
          path: nektar-mcp-bundle.tar.gz
          if-no-files-found: error
      - name: attach to the GitHub release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" nektar-mcp-bundle.tar.gz --clobber

      # npm-publish removed — the bundle ships as a release asset
      # (nektar-mcp-bundle.tar.gz) and via the GHCR image instead
