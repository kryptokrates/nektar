<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="An anchor puts a small fingerprint on Bitcoin and produces a clickable tamper-proof receipt">
  <title>Receipt and Anchor</title>
  <rect width="320" height="140" rx="12" fill="#151211"/>
  <!-- 3 Chain blocks -->
  <line x1="68" y1="42" x2="104" y2="42" stroke="#3a342f" stroke-width="2.5"/>
  <line x1="156" y1="42" x2="192" y2="42" stroke="#3a342f" stroke-width="2.5"/>
  <rect x="22" y="24" width="48" height="36" rx="7" fill="#1e1a17" stroke="#3a342f"/>
  <rect x="104" y="24" width="54" height="36" rx="7" fill="#231c15" stroke="#f7991b" stroke-width="2"/>
  <text x="131" y="46" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" font-weight="800" fill="#f7991b">STAMP</text>
  <rect x="192" y="24" width="48" height="36" rx="7" fill="#1e1a17" stroke="#3a342f"/>
  <text x="275" y="46" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#958d85">BSV chain</text>

  <!-- Vertical dashed proof link -->
  <line x1="131" y1="62" x2="131" y2="82" stroke="#4cc26b" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Receipt pill -->
  <rect x="44" y="84" width="232" height="38" rx="10" fill="#1a1f1b" stroke="#4cc26b" stroke-width="1.6"/>
  <circle cx="68" cy="103" r="10" fill="rgba(76,194,107,0.2)"/>
  <path d="M63 103 l3.5 3.5 l6.5 -6.5" fill="none" stroke="#4cc26b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="100" font-family="ui-monospace,monospace" font-size="11" font-weight="800" fill="#f4efe6">nektarr1.verified</text>
  <text x="88" y="114" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#958d85">Saved at 14:02 · Never edited</text>
</svg>
