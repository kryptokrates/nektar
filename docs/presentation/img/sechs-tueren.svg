<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" role="img" aria-label="Zwischen Agent und Händler stehen sechs Türen, jede mit eigenem Türsteher" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <g id="tuer">
      <rect width="92" height="150" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="6"/>
      <circle cx="72" cy="78" r="7" fill="#c2410c"/>
    </g>
  </defs>
  <rect width="1080" height="360" fill="#fbf8f1"/>
  <line x1="90" y1="170" x2="980" y2="170" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 10"/>

  <circle cx="56" cy="170" r="42" fill="#14213d"/>
  <text x="56" y="179" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Agent</text>

  <use href="#tuer" x="134" y="95"/>
  <use href="#tuer" x="270" y="95"/>
  <use href="#tuer" x="406" y="95"/>
  <use href="#tuer" x="542" y="95"/>
  <use href="#tuer" x="678" y="95"/>
  <use href="#tuer" x="814" y="95"/>

  <g font-size="30" font-weight="700" fill="#c2410c" text-anchor="middle">
    <text x="180" y="72">1</text>
    <text x="316" y="72">2</text>
    <text x="452" y="72">3</text>
    <text x="588" y="72">4</text>
    <text x="724" y="72">5</text>
    <text x="860" y="72">6</text>
  </g>

  <g font-size="23" font-weight="600" fill="#14213d" text-anchor="middle">
    <text x="180" y="286">OpenAI</text>
    <text x="316" y="286">Karten-</text>
    <text x="316" y="314">netzwerk</text>
    <text x="452" y="286">Bank</text>
    <text x="588" y="286">Firewall</text>
    <text x="588" y="314">des Händlers</text>
    <text x="724" y="286">Betrugs-</text>
    <text x="724" y="314">prüfung</text>
    <text x="860" y="286">Zahlungs-</text>
    <text x="860" y="314">abwickler</text>
  </g>

  <rect x="968" y="128" width="96" height="84" rx="8" fill="#0f766e"/>
  <text x="1016" y="179" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Händler</text>
</svg>
