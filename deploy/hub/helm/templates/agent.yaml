apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nektar-hub.fullname" . }}-hub
  labels:
    {{- include "nektar-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  serviceName: {{ include "nektar-hub.fullname" . }}-hub
  replicas: 1
  selector:
    matchLabels:
      {{- include "nektar-hub.labels" . | nindent 6 }}
      app.kubernetes.io/component: hub
  template:
    metadata:
      labels:
        {{- include "nektar-hub.labels" . | nindent 8 }}
        app.kubernetes.io/component: hub
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub
          image: {{ include "nektar-hub.image" (dict "root" . "component" "agent") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["serve", "-listen", ":18420", "-hub"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: NEKTAR_NETWORK
              value: {{ .Values.network | quote }}
            - name: NEKTAR_DATA_DIR
              value: /data
            - name: NEKTAR_HTTP_PORT
              value: "18420"
            - name: NEKTAR_EMBED_HUB
              value: "1"
            - name: NEKTAR_MODEL_ID
              value: {{ .Values.agent.modelId | quote }}
            - name: NEKTAR_PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            - name: NEKTAR_VERIFY_BASE
              value: {{ .Values.agent.verifyBase | default .Values.publicUrl | quote }}
            - name: NEKTAR_TRUST_PROXY
              value: {{ ternary "1" "0" .Values.trustProxy | quote }}
            - name: NEKTAR_MARKET_HOSTS
              value: {{ .Values.marketHosts | quote }}
            - name: NEKTAR_SEED_DOMAINS
              value: {{ .Values.agent.seedDomains | quote }}
            - name: NEKTAR_HEADERS_SOURCE
              value: {{ .Values.agent.headersSource | quote }}
            - name: NEKTAR_SETTLE_SPEC
              value: {{ .Values.agent.settleSpec | quote }}
            - name: NEKTAR_MAX_FEE_PER_TX
              value: {{ .Values.agent.maxFeeSatsPerTx | quote }}
            - name: NEKTAR_MAX_SPEND_PER_DAY
              value: {{ .Values.agent.maxSpendSatsPerDay | quote }}
            - name: NEKTAR_MAINNET_CONFIRM
              value: {{ .Values.agent.mainnetConfirm | quote }}
            - name: NEKTAR_HTTP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nektar-hub.secretName" . }}
                  key: NEKTAR_HTTP_TOKEN
            - name: NEKTAR_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nektar-hub.secretName" . }}
                  key: NEKTAR_OPERATOR_TOKEN
          ports:
            - name: http
              containerPort: 18420
          startupProbe:
            httpGet:
              path: /v1/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 10
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.agentSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nektar-hub.fullname" . }}-hub
  labels:
    {{- include "nektar-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port | default 18420 }}
      targetPort: http
  selector:
    {{- include "nektar-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
