#cloud-config
# Nektar Hub Node — Universal 1-Click Cloud-Init (Hetzner Cloud, DigitalOcean,
# Vultr, Linode, AWS EC2, GCP Compute Engine).
#
# Paste into "User Data" when creating any Ubuntu/Debian VPS (>= 1 vCPU, 2 GB RAM):
#   1. Installs Docker Engine + Compose plugin
#   2. Pulls GHCR Hub images (nektar, nektar-bbox-host, nektar-shim, nektar-hub-db, caddy)
#   3. Auto-provisions trusted Let's Encrypt HTTPS via <public-ip>.sslip.io
#      (or replace NEKTAR_AUTO_IP=1 with NEKTAR_PUBLIC_URL=https://hub.yourdomain.com)
#   4. Requests a free testnet faucet drip and announces the hub on the dir lane
#
# Ready in ~90 seconds. Check status via: ssh root@<ip> "cd /root/nektar-hub && docker compose logs -f agent"
package_update: true
packages:
  - curl
  - ca-certificates
  - openssl
runcmd:
  - |
    export NEKTAR_HUB_DIR=/opt/nektar-hub
    export NEKTAR_AUTO_IP=1
    curl -fsSL https://raw.githubusercontent.com/kryptokrates/nektar/master/deploy/hub/install.sh | bash
