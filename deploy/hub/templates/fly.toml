# Fly.io 1-Click Cloud Nektar v0.1 Hub (single Go binary + persistent volume + auto-HTTPS).
# Deploy: fly launch --config deploy/hub/templates/fly.toml --copy-config
app = 'nektar-hub'
primary_region = 'fra'

[build]
  image = 'ghcr.io/kryptokrates/nektar:latest'

[processes]
  app = 'serve -listen :18420 -restate-listen 127.0.0.1:9080 -hub'

[env]
  NEKTAR_NETWORK = 'testnet'
  NEKTAR_DATA_DIR = '/data'
  NEKTAR_HTTP_PORT = '18420'
  NEKTAR_EMBED_HUB = '1'
  NEKTAR_TRUST_PROXY = '1'
  NEKTAR_SEED_DOMAINS = '*'

[http_service]
  internal_port = 18420
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/v1/health'

[[mounts]]
  source = 'nektar_data'
  destination = '/data'
  initial_size = '5gb'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
