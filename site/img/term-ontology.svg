<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="An ontology is a shared dictionary and a bridge translates cleanly between two different dictionaries">
  <title>Ontology and Bridge</title>
  <rect width="320" height="140" rx="12" fill="#151211"/>
  <!-- Left Dictionary -->
  <rect x="18" y="34" width="100" height="72" rx="10" fill="#161d26" stroke="#78b4ff" stroke-width="1.6"/>
  <text x="68" y="58" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" font-weight="800" fill="#78b4ff">ONTOLOGY A</text>
  <text x="68" y="76" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#d5cec7">Shared words</text>
  <text x="68" y="92" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#958d85">"Bug" · "Fix"</text>

  <!-- Right Dictionary -->
  <rect x="202" y="34" width="100" height="72" rx="10" fill="#221b14" stroke="#f7991b" stroke-width="1.6"/>
  <text x="252" y="58" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" font-weight="800" fill="#f7991b">ONTOLOGY B</text>
  <text x="252" y="76" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#d5cec7">Shared words</text>
  <text x="252" y="92" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#958d85">"CVE" · "Patch"</text>

  <!-- Glowing Bridge Arch -->
  <path d="M120 66 Q160 22 200 66" fill="none" stroke="#4cc26b" stroke-width="2.6"/>
  <rect x="130" y="58" width="60" height="22" rx="11" fill="#152119" stroke="#4cc26b" stroke-width="1.4"/>
  <text x="160" y="73" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" font-weight="800" fill="#4cc26b">BRIDGE</text>

  <text x="160" y="126" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6c655e">Different AIs speak the exact same meaning</text>
</svg>
