# hub — an independent nektar hub in one box: your own agent + your own
# market host pair, announcing itself on the dir lane so fresh instances
# can find it without a registry.
#
#   cp .env.example .env  → set the marked values (public base URL matters:
#   NEKTAR_MARKET_HOSTS must be the hosts' PUBLIC URLs — they go verbatim
#   into your announce + finger record for other operators to use)
#   docker compose -f deploy/hub/compose.yaml --env-file deploy/hub/.env up -d
#
# Fully self-contained — every service pulls a published image, nothing is
# mounted from a checkout. nektar-bbox-host carries the overlay modules,
# nektar-shim the header/watch shims, nektar-hub-db the schema.
name: nektar-hub
services:
  agent:
    image: ghcr.io/kryptokrates/nektar:${NEKTAR_IMAGE_TAG:-latest}${NEKTAR_IMAGE_DIGEST:+@${NEKTAR_IMAGE_DIGEST}}
    restart: unless-stopped
    ports:
      - '${NEKTAR_HTTP_PORT:-8080}:8080'
    environment:
      NEKTAR_NETWORK: ${NEKTAR_NETWORK:-testnet}
      NEKTAR_DATA_DIR: /data
      NEKTAR_HTTP_PORT: '8080'
      NEKTAR_HTTP_HOST: '0.0.0.0'
      NEKTAR_KEY_PASSPHRASE: ${NEKTAR_KEY_PASSPHRASE:?set NEKTAR_KEY_PASSPHRASE in .env}
      NEKTAR_HTTP_TOKEN: ${NEKTAR_HTTP_TOKEN:?set NEKTAR_HTTP_TOKEN in .env}
      NEKTAR_MODEL_ID: ${NEKTAR_MODEL_ID:-unspecified}
      NEKTAR_AUTOMATION: '1'
      NEKTAR_FUND_WIF: ${NEKTAR_FUND_WIF:-}
      NEKTAR_FUND_TXIDS: ${NEKTAR_FUND_TXIDS:-}
      NEKTAR_MARKET_LOCAL_HOSTS: ${NEKTAR_MARKET_LOCAL_HOSTS:-}
      NEKTAR_MAINNET_CONFIRM: ${NEKTAR_MAINNET_CONFIRM:-}
      NEKTAR_MAX_FEE_SATS_PER_TX: ${NEKTAR_MAX_FEE_SATS_PER_TX:-}
      NEKTAR_MAX_SPEND_SATS_PER_DAY: ${NEKTAR_MAX_SPEND_SATS_PER_DAY:-}
      NEKTAR_MIN_BROADCAST_INTERVAL_MS: ${NEKTAR_MIN_BROADCAST_INTERVAL_MS:-}
      NEKTAR_PAYMENTS: ${NEKTAR_PAYMENTS:-}
      NEKTAR_PAID_DISCLOSURE: ${NEKTAR_PAID_DISCLOSURE:-}
      NEKTAR_MARKET_HOSTS: ${NEKTAR_MARKET_HOSTS:?set the hosts' PUBLIC URLs — see .env}
      NEKTAR_ANNOUNCE: ${NEKTAR_ANNOUNCE:-1}
      NEKTAR_SEED_DOMAINS: ${NEKTAR_SEED_DOMAINS:-}
      NEKTAR_BFINGER_PUBLISH: ${NEKTAR_BFINGER_PUBLISH:-1}
      NEKTAR_PUSH_PUBLIC: ${NEKTAR_PUSH_PUBLIC:-}
      NEKTAR_WATCH_URLS: ${NEKTAR_WATCH_URLS:-}
      NEKTAR_WATCH_PUBLIC: ${NEKTAR_WATCH_PUBLIC:-}
    volumes:
      - agent-data:/data
    depends_on:
      host-a:
        condition: service_started
      host-b:
        condition: service_started
  db:
    image: ghcr.io/kryptokrates/nektar-hub-db:${NEKTAR_IMAGE_TAG:-latest}
    environment:
      MYSQL_DATABASE: overlay
      MYSQL_USER: overlay
      MYSQL_PASSWORD: ${OVERLAY_DB_PASSWORD:?set OVERLAY_DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    command: ['--innodb-buffer-pool-size=128M', '--performance-schema=OFF']
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uoverlay -p$${MYSQL_PASSWORD} --silent']
      interval: 3s
      timeout: 2s
      retries: 40
    volumes:
      - db:/var/lib/mysql
  shim:
    image: ghcr.io/kryptokrates/nektar-shim:${NEKTAR_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ['node', 'header-shim.mjs']
    environment:
      SHIM_PORT: 8080
      SHIM_MODE: live
      # testnet defaults — on mainnet the operator supplies their own
      # broadcaster/index/chaintracks endpoints in .env (self-hosted
      # Teranode or a public ARC-compatible service)
      SHIM_BROADCASTER: ${SHIM_BROADCASTER:-https://arcade-v2-testnet-us-1.bsvblockchain.tech}
      SHIM_INDEX: ${SHIM_INDEX:-https://test.bananablocks.com/api/v1}
      SHIM_CHAINTRACKS: ${SHIM_CHAINTRACKS:-https://arcade-v2-testnet-us-1.bsvblockchain.tech/chaintracks/v2}
  watch-a:
    image: ghcr.io/kryptokrates/nektar-shim:${NEKTAR_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ['node', 'watch-shim.mjs']
    environment:
      BACKEND: http://host-a:8080
      PORT: 8081
    depends_on:
      host-a:
        condition: service_started
    ports:
      - '${WATCH_A_PORT:-18393}:8081'
  watch-b:
    image: ghcr.io/kryptokrates/nektar-shim:${NEKTAR_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ['node', 'watch-shim.mjs']
    environment:
      BACKEND: http://host-b:8080
      PORT: 8081
    depends_on:
      host-b:
        condition: service_started
    ports:
      - '${WATCH_B_PORT:-18394}:8081'
  host-a: &host
    image: ghcr.io/kryptokrates/nektar-bbox-host:${NEKTAR_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      shim:
        condition: service_started
    environment: &hostenv
      BBOX_OFFICES: nektar_abcdefghij
      BLOGS_STREAMS: nektar_abcdefghij=open
      BLOGS_STATE_DIR: /var/lib/bbox/blogs
      BLOGS_KEEP_DAYS: 90
      # lane topics derive from ONE knob — NEKTAR_NETWORK — so topics, the
      # module's served nets and the agent's chain can never skew. On main
      # the dir lane rides the same 16-nibble space (dir hashes to a nibble).
      OVERLAY_TOPICS: tm_bbox_nektar_abcdefghij,tm_log_nektar_abcdefghij,tm_finger,tm_nektar_${NEKTAR_NETWORK:-testnet}_0,tm_nektar_${NEKTAR_NETWORK:-testnet}_1,tm_nektar_${NEKTAR_NETWORK:-testnet}_2,tm_nektar_${NEKTAR_NETWORK:-testnet}_3,tm_nektar_${NEKTAR_NETWORK:-testnet}_4,tm_nektar_${NEKTAR_NETWORK:-testnet}_5,tm_nektar_${NEKTAR_NETWORK:-testnet}_6,tm_nektar_${NEKTAR_NETWORK:-testnet}_7,tm_nektar_${NEKTAR_NETWORK:-testnet}_8,tm_nektar_${NEKTAR_NETWORK:-testnet}_9,tm_nektar_${NEKTAR_NETWORK:-testnet}_a,tm_nektar_${NEKTAR_NETWORK:-testnet}_b,tm_nektar_${NEKTAR_NETWORK:-testnet}_c,tm_nektar_${NEKTAR_NETWORK:-testnet}_d,tm_nektar_${NEKTAR_NETWORK:-testnet}_e,tm_nektar_${NEKTAR_NETWORK:-testnet}_f
      OVERLAY_MODULES: /app/modules/bbox/bbox-module.js,/app/modules/nektar/nektar-module.js,/app/modules/blogs/blogs-module.js,/app/modules/finger/finger-module.js
      OVERLAY_CHAIN_TRACKER_URL: http://shim:8080
      BBOX_ASSET_URL: http://shim:8080
      OVERLAY_ADMIN_TOKEN: ${OVERLAY_ADMIN_TOKEN:?set OVERLAY_ADMIN_TOKEN in .env}
      NEKTAR_NETS: ${NEKTAR_NETWORK:-testnet}
      OVERLAY_KNEX_URL: mysql://overlay:${OVERLAY_DB_PASSWORD}@db:3306/overlay
    volumes:
      - host-state-a:/var/lib/bbox
    ports:
      - '${HOST_A_PORT:-18391}:8080'
  host-b:
    <<: *host
    environment:
      <<: *hostenv
      OVERLAY_KNEX_URL: mysql://overlay:${OVERLAY_DB_PASSWORD}@db:3306/overlay_b
    volumes:
      - host-state-b:/var/lib/bbox
    ports:
      - '${HOST_B_PORT:-18392}:8080'
volumes:
  agent-data: {}
  db: {}
  host-state-a: {}
  host-state-b: {}
