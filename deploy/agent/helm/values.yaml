image:
  repository: ghcr.io/kryptokrates/nektar
  # 'latest' = last tagged release — it may predate the deploy files'
  # assumptions (e.g. the required rt sidecar). Pin a tag/digest that
  # carries the features this chart wires.
  tag: latest
  # sha256:<hex> — when set, pulls repository@digest and ignores tag.
  # Recommended on any box holding real keys.
  digest: ''
  pullPolicy: IfNotPresent

# regtest | testnet | main
network: testnet

# comma-separated market hosts the agent publishes/reads through — REQUIRED.
# Any operator works; run your own with deploy/bstack-sandbox.
marketHosts: ''

automation: true
# auto-decide policy approvals. false = approvals queue for the operator token.
unattended: false
modelId: unspecified

# publish the bfinger finger record so peers can resolve hosts/office/stream.
bfingerPublish: false
# public URL peers POST pushed carriers to — set once ingress is up, e.g.
# https://agent.example.com/v1/lane
pushPublic: ''
# comma-separated long-poll watch shims (optional — plain polls are the
# correct-by-design fallback)
watchUrls: ''
watchPublic: ''
# operator-only approval token for the loopback approval endpoints
operatorToken: ''
# public base used to render receipt-verify links (default: this instance)
verifyBase: ''

secrets:
  # bearer for /mcp + private /v1 endpoints — required unless existingSecret is set
  httpToken: ''
  # bring your own Secret instead: must carry NEKTAR_HTTP_TOKEN
  existingSecret: ''

persistence:
  size: 5Gi
  storageClass: ''
  # existingClaim: ""

service:
  type: ClusterIP
  port: 18420

ingress:
  enabled: false
  className: ''
  host: agent.example.com
  tls: false
  # tlsSecretName: ""   # set for a manually-provisioned cert

# market tuning — blank = library default
minCollectMs: ''
collectQuietMs: ''

# SpendGuard caps — recommended on any box holding real keys
maxFeeSatsPerTx: ''
maxSpendSatsPerDay: ''

# node runtime + sqlite — sized for a single-agent pod; raise for heavy
# memory shards. Requests without limits keep OOM semantics predictable.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 1Gi

# the Restate executor sidecar — required, runs in the same pod so loopback
# URLs are correct. Journals get their own claim.
restate:
  image:
    repository: docker.restate.dev/restatedev/restate
    # pinned — the executor is required infrastructure; a silent major bump
    # on 'latest' is not a deployable risk
    tag: '1.8.1'
    pullPolicy: IfNotPresent
  identityPublicKey: ''
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  persistence:
    size: 1Gi
    storageClass: '' # falls back to persistence.storageClass when empty
