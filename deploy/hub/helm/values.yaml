# nektar-hub v0.1 — single-binary Pure-Go Agent + embedded 16-lane SQLite Overlay Hub.
images:
  agent:
    repository: ghcr.io/kryptokrates/nektar
  tag: latest
  digest: ''
  pullPolicy: IfNotPresent

# memory | regtest | testnet | main
network: testnet

# Public base URL of this Hub (e.g. https://hub.example.com).
publicUrl: ''
# Trust X-Forwarded-* headers from the cluster Ingress controller.
trustProxy: true
# Optional extra peer market hosts (comma-separated).
marketHosts: ''

agent:
  modelId: unspecified
  seedDomains: '*'
  verifyBase: ''
  headersSource: ''
  settleSpec: ''
  maxFeeSatsPerTx: ''
  maxSpendSatsPerDay: ''
  mainnetConfirm: ''

secrets:
  httpToken: ''
  operatorToken: ''
  existingSecret: ''

persistence:
  storageClass: ''
  agentSize: 5Gi

service:
  type: ClusterIP
  port: 18420

ingress:
  enabled: false
  className: ''
  agentHost: ''
  tls: false
  tlsSecretName: ''

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

restate:
  image:
    repository: docker.restate.dev/restatedev/restate
    tag: '1.8.1'
    pullPolicy: IfNotPresent
  identityPublicKey: ''
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  persistence:
    size: 1Gi
    storageClass: ''
