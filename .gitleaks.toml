# gitleaks — local `check:secrets` runs `gitleaks dir` (working tree) and CI
# runs `gitleaks git` on the incoming commit range.
#
# paths  : local-only secret stores (all .gitignore'd — they hold keys BY DESIGN)
# regexes: a repo full of public crypto material — txids, pubkeys, vkey and
#          field constants — floods generic-api-key on hex. Suppress hex-only
#          lines; WIF keys and API tokens are not hex and still flag.
[extend]
useDefault = true

# WIF private keys — gitleaks' generic rules miss base58. Mainnet: 5/K/L;
# testnet: 9/c. 51-52 chars total on the base58 alphabet.
[[rules]]
id = "bitcoin-wif"
description = "Bitcoin WIF private key (mainnet or testnet, compressed or not)"
regex = '''\b[5KL9c][1-9A-HJ-NP-Za-km-z]{50,51}\b'''

# commits whose WIFs are already dead: the keys were swept and the files
# either deleted or moved to env/gitignored key files. Scoping the skip to
# this rule (not a global commit skip) keeps every other check live there.
[rules.allowlist]
commits = [
  "853da4888c73f9614e4672bf17acd7eb32e44485", # tn-probe2.mjs + tn-trees.mjs (deleted)
  "a1c8f1c7e9ce8e3abf408ad9ffceac3ec9803a5f", # tn-probe.mjs (deleted)
  "ad097b2248a5e5f505fd9d2cef5fd29147598feb", # market-testnet.test.ts (now env keys)
  "49078a6f6f467aefd52f52abf64ff4e38dc75d9f", # split-fund.mjs (WIFs swept -> env)
]

[allowlist]
paths = [
  # all *.env* stores are gitignored (except .env.example — kept flaggable)
  '''(^|/)\.env$''',
  '''(^|/)\.env\.bak''',
  '''(^|/)\.env\.local''',
  '''(^|/)\.env\.production''',
  '''(^|/)\.env\.development''',
  '''(^|/)\.env\.test''',
  '''^\.nektar($|/)''',
  '''^\.state($|/)''',
  '''^\.mod($|/)''',
  '''^dist-deploy($|/)''',
  '''^tools/groth16-spike($|/)''',
  '''(^|/)target($|/)''',
  '''(^|/)scratch($|/)''',
  # BRC-100 conformance vectors — 'wallet/primary/self|anyone' derivation
  # identifiers trip generic-api-key; they are protocol names, not secrets
  '''(^|/)test/vectors($|/)''',
]
regexTarget = "line"
regexes = [
  '''0x[0-9a-fA-F]{32,}''',
  '''\b[0-9a-fA-F]{64,}\b''',
]
stopWords = [
  '''0x123456789abcdef''',
  '''r3.items''',
]
