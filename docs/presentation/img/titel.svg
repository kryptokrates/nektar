<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720" role="img" aria-label="Eine Straße teilt sich: links eine Mautschranke, rechts freie Fahrt" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="540" height="720" fill="#fbf8f1"/>
  <circle cx="420" cy="300" r="56" fill="#fde68a"/>
  <rect y="300" width="540" height="420" fill="#eef2e6"/>

  <!-- road: stem, left branch (toll), right branch (open) -->
  <polygon points="200,720 340,720 305,520 235,520" fill="#475569"/>
  <polygon points="235,520 270,520 150,300 112,300" fill="#475569"/>
  <polygon points="270,520 305,520 440,300 402,300" fill="#0f766e"/>

  <!-- toll booth and barrier -->
  <rect x="40" y="350" width="62" height="78" rx="4" fill="#14213d"/>
  <rect x="32" y="338" width="78" height="14" rx="3" fill="#c2410c"/>
  <rect x="52" y="364" width="38" height="26" fill="#fde68a"/>
  <rect x="102" y="394" width="150" height="12" fill="#ffffff" stroke="#14213d" stroke-width="2"/>
  <rect x="120" y="394" width="22" height="12" fill="#c2410c"/>
  <rect x="164" y="394" width="22" height="12" fill="#c2410c"/>
  <rect x="208" y="394" width="22" height="12" fill="#c2410c"/>

  <text x="92" y="476" text-anchor="middle" font-size="30" font-weight="700" fill="#c2410c">MAUT</text>
  <text x="450" y="476" text-anchor="middle" font-size="30" font-weight="700" fill="#0f766e">OFFEN</text>
</svg>
