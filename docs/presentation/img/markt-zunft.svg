<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720" role="img" aria-label="Markt: die Briefmarke fragt nur nach dem Porto. Zunft: der Ausweis fragt nach der Person" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="540" height="720" fill="#fbf8f1"/>

  <!-- market: the stamp -->
  <text x="40" y="70" font-size="34" font-weight="700" fill="#0f766e">MARKT</text>
  <rect x="40" y="110" width="150" height="180" fill="#ffffff" stroke="#0f766e" stroke-width="6" stroke-dasharray="4 10" stroke-linecap="round"/>
  <rect x="62" y="132" width="106" height="136" fill="#e7f3f1"/>
  <text x="115" y="224" text-anchor="middle" font-size="76" font-weight="700" fill="#0f766e">1</text>
  <text x="230" y="170" font-size="28" fill="#14213d">Ist das Porto</text>
  <text x="230" y="206" font-size="28" fill="#14213d">bezahlt?</text>
  <text x="230" y="262" font-size="30" font-weight="700" fill="#0f766e">→ durch.</text>

  <line x1="40" y1="360" x2="500" y2="360" stroke="#d9dee7" stroke-width="3"/>

  <!-- guild: the badge -->
  <text x="40" y="430" font-size="34" font-weight="700" fill="#c2410c">ZUNFT</text>
  <rect x="40" y="470" width="150" height="180" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="6"/>
  <rect x="96" y="456" width="38" height="24" rx="6" fill="#c2410c"/>
  <circle cx="115" cy="536" r="30" fill="#c2410c"/>
  <line x1="66" y1="596" x2="164" y2="596" stroke="#94a3b8" stroke-width="6"/>
  <line x1="66" y1="620" x2="140" y2="620" stroke="#94a3b8" stroke-width="6"/>
  <text x="230" y="530" font-size="28" fill="#14213d">Wer bist du?</text>
  <text x="230" y="576" font-size="28" fill="#14213d">Wer bürgt für dich?</text>
  <text x="230" y="632" font-size="30" font-weight="700" fill="#c2410c">→ vielleicht.</text>
</svg>
