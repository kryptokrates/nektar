# Two real reference hosts on public BSV testnet (Phase 4b).
# Standalone project: `docker compose -p nektar-bstack-testnet -f deploy/bstack-sandbox/compose.testnet.yaml up -d`
# The shim (SHIM_MODE=live) serves the hosts' tracker calls from the testnet
# broadcaster's chaintracks + WoC test, and its asset calls from the
# broadcaster's /tx merklePath + WoC /spent reads — no Teranode involved.
#
# Image-only: hosts/shims/db run the derived ghcr images (release.yml
# hub-images job) — no checkout, no local bundle build. For local module
# iteration, layer a compose.override.yaml with the old bind mounts back on.
name: nektar-bstack-testnet
services:
  db:
    image: ghcr.io/kryptokrates/nektar-hub-db:edge
    environment:
      MYSQL_DATABASE: overlay
      MYSQL_USER: overlay
      MYSQL_PASSWORD: spike
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    command: ['--innodb-buffer-pool-size=128M', '--performance-schema=OFF']
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uoverlay -pspike --silent']
      interval: 3s
      timeout: 2s
      retries: 40
    volumes:
      - db:/var/lib/mysql
  shim:
    image: ghcr.io/kryptokrates/nektar-shim:edge
    working_dir: /shim
    command: ['node', 'header-shim.mjs']
    environment:
      SHIM_PORT: 8080
      SHIM_MODE: live
      SHIM_BROADCASTER: https://arcade-v2-testnet-us-1.bsvblockchain.tech
      SHIM_INDEX: https://test.bananablocks.com/api/v1
      SHIM_CHAINTRACKS: https://arcade-v2-testnet-us-1.bsvblockchain.tech/chaintracks/v2
      # public index/tracker APIs rate-limit per egress IP (WoC 429s under
      # suite load); a refused corroboration stalls every host submit, so
      # lone-source answers get served in degraded mode — still verified
      # SPV, just not 2-of-2. Set '0' to restore strict corroboration.
      SHIM_SINGLE_OK: '1'
  # beefcat (the lightwebinc reference carrier impl, built from pinned source)
  # — an INDEPENDENT client of this shim: its verifier only accepts carrier
  # postage anchored by roots this shim serves, so drift in the /v1/tip +
  # /v1/root contract fails the reference implementation, not our code.
  # Opt-in: `docker compose -f ... --profile conformance run --rm beefcat`
  # runs the smoke (self-check on a local devchain, then a foreign-chain
  # stream refused through this shim). `--entrypoint sh beefcat` opens an
  # operator shell for real testnet flows (init/fund/verify) with a
  # persistent home on the beefcat-home volume.
  beefcat:
    profiles: ['conformance']
    build: ./beefcat
    depends_on:
      shim:
        condition: service_started
    environment:
      BEEFCAT_SHIM: http://shim:8080
    volumes:
      - beefcat-home:/home/beefcat
  # watch-shim: long-poll wake layer in front of each stock host's /lookup —
  # agents hold GET /watch subscriptions and senders POST /notify; every wake
  # is only a hint (consumers re-verify via their own reads), so a shim being
  # down degrades to ordinary polling. Ports mirror the host + 2.
  watch-a:
    image: ghcr.io/kryptokrates/nektar-shim:edge
    working_dir: /shim
    restart: unless-stopped
    command: ['node', 'watch-shim.mjs']
    environment:
      BACKEND: http://host-a:8080
      PORT: 8080
    depends_on:
      host-a:
        condition: service_started
    ports:
      - '127.0.0.1:18293:8080'
  watch-b:
    image: ghcr.io/kryptokrates/nektar-shim:edge
    working_dir: /shim
    restart: unless-stopped
    command: ['node', 'watch-shim.mjs']
    environment:
      BACKEND: http://host-b:8080
      PORT: 8080
    depends_on:
      host-b:
        condition: service_started
    ports:
      - '127.0.0.1:18294:8080'
  host-a: &host
    image: ghcr.io/kryptokrates/nektar-bbox-host:edge
    depends_on:
      db:
        condition: service_healthy
      shim:
        condition: service_started
    environment: &hostenv
      BBOX_OFFICES: nektar_abcdefghij
      BLOGS_STREAMS: nektar_abcdefghij=open
      BLOGS_STATE_DIR: /var/lib/bbox/blogs
      BLOGS_KEEP_DAYS: 90
      OVERLAY_TOPICS: tm_bbox_nektar_abcdefghij,tm_log_nektar_abcdefghij,tm_finger,tm_nektar_testnet_0,tm_nektar_testnet_1,tm_nektar_testnet_2,tm_nektar_testnet_3,tm_nektar_testnet_4,tm_nektar_testnet_5,tm_nektar_testnet_6,tm_nektar_testnet_7,tm_nektar_testnet_8,tm_nektar_testnet_9,tm_nektar_testnet_a,tm_nektar_testnet_b,tm_nektar_testnet_c,tm_nektar_testnet_d,tm_nektar_testnet_e,tm_nektar_testnet_f
      OVERLAY_MODULES: /app/modules/bbox/bbox-module.js,/app/modules/nektar/nektar-module.js,/app/modules/blogs/blogs-module.js,/app/modules/finger/finger-module.js
      OVERLAY_CHAIN_TRACKER_URL: http://shim:8080
      BBOX_ASSET_URL: http://shim:8080
      OVERLAY_ADMIN_TOKEN: spike-token
      NEKTAR_NETS: testnet
      OVERLAY_KNEX_URL: mysql://overlay:spike@db:3306/overlay
    volumes:
      - host-state-a:/var/lib/bbox
    ports:
      - '127.0.0.1:18291:8080'
  host-b:
    <<: *host
    environment:
      <<: *hostenv
      OVERLAY_KNEX_URL: mysql://overlay:spike@db:3306/overlay_b
    volumes:
      - host-state-b:/var/lib/bbox
    ports:
      - '127.0.0.1:18292:8080'
volumes:
  db: {}
  host-state-a: {}
  host-state-b: {}
  beefcat-home: {}
