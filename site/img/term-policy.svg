<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="Spending policy caps limit daily and per-deal sats with a one-click emergency kill switch">
  <title>Spending Policy and Kill Switch</title>
  <rect width="320" height="140" rx="12" fill="#151211"/>
  <!-- Left: Cap sliders -->
  <rect x="18" y="20" width="174" height="100" rx="10" fill="#1e1a17" stroke="#3a342f" stroke-width="1.5"/>
  <text x="32" y="40" font-family="ui-monospace,monospace" font-size="10" font-weight="800" fill="#4cc26b">SPENDING CAPS</text>

  <text x="32" y="62" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#d5cec7">Per deal: 200 sats</text>
  <rect x="32" y="68" width="144" height="6" rx="3" fill="#2c2723"/>
  <rect x="32" y="68" width="58" height="6" rx="3" fill="#4cc26b"/>
  <circle cx="90" cy="71" r="5" fill="#f4efe6"/>

  <text x="32" y="94" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#d5cec7">Per day: 2,000 sats</text>
  <rect x="32" y="100" width="144" height="6" rx="3" fill="#2c2723"/>
  <rect x="32" y="100" width="92" height="6" rx="3" fill="#f7991b"/>
  <circle cx="124" cy="103" r="5" fill="#f4efe6"/>

  <!-- Right: Kill Switch -->
  <rect x="206" y="20" width="96" height="100" rx="10" fill="#231616" stroke="rgba(239,100,97,0.55)" stroke-width="1.6"/>
  <circle cx="254" cy="60" r="22" fill="#ef6461"/>
  <text x="254" y="64" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="900" fill="#161413">STOP</text>
  <text x="254" y="100" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#ef6461">Kill Switch</text>
  <text x="254" y="113" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#958d85">1-click freeze</text>
</svg>
