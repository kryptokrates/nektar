<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-label="How Nektar works in 3 simple steps: plug in your AI apps, store encrypted memories locally, get tamper-proof receipts or trade facts for pennies">
  <title>How Nektar Works in 3 Steps</title>
  <defs>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffac33"/>
      <stop offset="100%" stop-color="#e86a0c"/>
    </linearGradient>
    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7991b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f7991b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="220" rx="16" fill="#110f0e"/>

  <!-- Step 1: Your AI Apps -->
  <rect x="20" y="20" width="240" height="180" rx="14" fill="#171412" stroke="#282421" stroke-width="1.5"/>
  <rect x="34" y="32" width="54" height="20" rx="10" fill="rgba(247,153,27,0.14)" stroke="rgba(247,153,27,0.4)"/>
  <text x="61" y="46" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" font-weight="800" fill="#f7991b">STEP 1</text>
  <text x="100" y="46" font-family="system-ui,-apple-system,sans-serif" font-size="13.5" font-weight="800" fill="#f4efe6">Plug in your AIs</text>

  <!-- 4 AI Pills -->
  <g font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#f4efe6">
    <rect x="36" y="66" width="98" height="36" rx="9" fill="#1e1a17" stroke="#3a342f"/>
    <circle cx="52" cy="84" r="5" fill="#f7991b"/>
    <text x="65" y="88">Claude</text>

    <rect x="146" y="66" width="98" height="36" rx="9" fill="#1e1a17" stroke="#3a342f"/>
    <circle cx="162" cy="84" r="5" fill="#78b4ff"/>
    <text x="175" y="88">Cursor</text>

    <rect x="36" y="112" width="98" height="36" rx="9" fill="#1e1a17" stroke="#3a342f"/>
    <circle cx="52" cy="130" r="5" fill="#4cc26b"/>
    <text x="65" y="134">Codex</text>

    <rect x="146" y="112" width="98" height="36" rx="9" fill="#1e1a17" stroke="#3a342f"/>
    <circle cx="162" cy="130" r="5" fill="#c792ea"/>
    <text x="175" y="134">OpenClaw</text>
  </g>
  <text x="140" y="178" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#958d85">One click. Never repeat yourself.</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="266" y1="110" x2="316" y2="110" stroke="#f7991b" stroke-width="2.5" stroke-dasharray="5 4"/>
  <polygon points="315,103 328,110 315,117" fill="#f7991b"/>

  <!-- Step 2: Local Encrypted Brain -->
  <rect x="332" y="20" width="236" height="180" rx="14" fill="#171412" stroke="rgba(247,153,27,0.45)" stroke-width="1.5"/>
  <circle cx="450" cy="112" r="72" fill="url(#centerAura)"/>
  <rect x="346" y="32" width="54" height="20" rx="10" fill="rgba(247,153,27,0.18)" stroke="rgba(247,153,27,0.55)"/>
  <text x="373" y="46" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" font-weight="800" fill="#f7991b">STEP 2</text>
  <text x="410" y="46" font-family="system-ui,-apple-system,sans-serif" font-size="13.5" font-weight="800" fill="#f4efe6">Your Locked Brain</text>

  <!-- Hexagon Vault -->
  <polygon points="450,64 492,86 492,130 450,152 408,130 408,86" fill="#211c18" stroke="url(#amberGlow)" stroke-width="2.5"/>
  <!-- Padlock inside hex -->
  <path d="M439 106 v-7 a11 11 0 0 1 22 0 v7" fill="none" stroke="#f7991b" stroke-width="3" stroke-linecap="round"/>
  <rect x="434" y="106" width="32" height="24" rx="5" fill="#f7991b"/>
  <circle cx="450" cy="118" r="3.5" fill="#161413"/>

  <text x="450" y="178" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#958d85">Encrypted on YOUR PC. Private by default.</text>

  <!-- Arrow 2 -> 3 (split) -->
  <path d="M572 110 H598 V74 H622" fill="none" stroke="#4cc26b" stroke-width="2.2"/>
  <polygon points="620,68 632,74 620,80" fill="#4cc26b"/>
  <path d="M572 110 H598 V146 H622" fill="none" stroke="#f7991b" stroke-width="2.2"/>
  <polygon points="620,140 632,146 620,152" fill="#f7991b"/>

  <!-- Step 3A: Receipt -->
  <rect x="632" y="20" width="248" height="84" rx="13" fill="#171412" stroke="rgba(76,194,107,0.42)" stroke-width="1.5"/>
  <circle cx="662" cy="62" r="17" fill="rgba(76,194,107,0.16)" stroke="#4cc26b" stroke-width="1.8"/>
  <path d="M654 62 l5.5 5.5 l10.5 -10.5" fill="none" stroke="#4cc26b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="690" y="54" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="800" fill="#f4efe6">Tamper-Proof Receipts</text>
  <text x="690" y="74" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#958d85">Proves what your AI knew &amp; when.</text>

  <!-- Step 3B: Optional Market -->
  <rect x="632" y="116" width="248" height="84" rx="13" fill="#171412" stroke="rgba(247,153,27,0.42)" stroke-width="1.5"/>
  <circle cx="662" cy="158" r="17" fill="rgba(247,153,27,0.16)" stroke="#f7991b" stroke-width="1.8"/>
  <text x="662" y="164" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" font-weight="900" fill="#f7991b">₿</text>
  <text x="690" y="150" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="800" fill="#f4efe6">Knowledge Market</text>
  <text x="690" y="170" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#958d85">Optional: buy or sell for pennies.</text>
</svg>
