# Dokploy 1-Click Nektar v0.4 Hub Template (Pure-Go single binary + active Restate durable executor)
# In Dokploy: Projects -> Add Service -> Compose -> paste this file, set
# HUB_DOMAIN to your domain (Dokploy Traefik terminates TLS on hub:18420).
services:
  restate:
    image: docker.restate.dev/restatedev/restate:1.8.1
    restart: unless-stopped
    environment:
      RESTATE_NODE_NAME: nektar-hub
      RESTATE_BASE_DIR: /restate-data
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/9070 && printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && grep -q "200" <&3']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - restate-data:/restate-data

  hub:
    image: ghcr.io/kryptokrates/nektar:latest
    restart: unless-stopped
    command: ['serve', '-listen', ':18420', '-restate-listen', ':9080', '-hub']
    depends_on:
      restate:
        condition: service_healthy
    expose:
      - '18420'
    environment:
      NEKTAR_NETWORK: ${NEKTAR_NETWORK:-testnet}
      NEKTAR_DATA_DIR: /data
      NEKTAR_HTTP_PORT: '18420'
      NEKTAR_EMBED_HUB: '1'
      NEKTAR_TRUST_PROXY: '1'
      NEKTAR_SEED_DOMAINS: '*'
      NEKTAR_API_TOKEN: ${NEKTAR_HTTP_TOKEN:-}
      NEKTAR_OPERATOR_TOKEN: ${NEKTAR_OPERATOR_TOKEN:-}
      NEKTAR_PUBLIC_URL: https://${HUB_DOMAIN:?set HUB_DOMAIN}
      NEKTAR_VERIFY_BASE: https://${HUB_DOMAIN}
      NEKTAR_MARKET_HOSTS: ${NEKTAR_MARKET_HOSTS:-https://nektar.run/hub}
      NEKTAR_RESTATE_URL: http://restate:8080
      NEKTAR_RESTATE_ADMIN: http://restate:9070
      NEKTAR_RESTATE_ENDPOINT_URI: http://hub:9080
      NEKTAR_RESTATE_ALLOW_INSECURE_ENDPOINT: '1'
    volumes:
      - hub-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:18420/v1/health']
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  hub-data: {}
  restate-data: {}
