name: ci
on:
  push:
    branches: [master, main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # STARK proving needs the RISC Zero prover image (pnpm stark:image, 4.6 GB);
      # CI still verifies a real committed receipt via WASM (unit tests + reproduce).
      NEKTAR_E2E_STARK: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm
        run: corepack enable && corepack prepare pnpm@12.16.1 --activate
      - name: pnpm store cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm -r build
        timeout-minutes: 10
      - name: every import is declared
        run: pnpm check:deps
      - name: unit · contract · integration · fuzz
        run: pnpm -r test
        timeout-minutes: 10
      - name: reproduce (vectors + pinned vkey)
        run: pnpm reproduce
      - name: marketplace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: market-scenarios
          path: artifacts/market-scenarios
          if-no-files-found: ignore

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm
        run: corepack enable && corepack prepare pnpm@12.16.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@nektar/mcp...' build
      - name: probe — tmpdir bind-mounts reach the container
        run: |
          d=$(mktemp -d) && mkdir -p "$d/test" && echo probe > "$d/test/build.test.js"
          docker run --rm -v "$d:/work" -w /work "node:22-alpine@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202" \
            sh -c 'ls -la /work /work/test && cat /work/test/build.test.js'
          rm -rf "$d"
      - name: isolated purchased-patch evaluation (real container, no network)
        run: node --test --test-force-exit packages/mcp/dist/test/automation-sandbox.test.js
        timeout-minutes: 10
        env:
          NEKTAR_SANDBOX_E2E: '1'

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm
        run: corepack enable && corepack prepare pnpm@12.16.1 --activate
      - run: pnpm install --frozen-lockfile
      # the dep-graph gate resolves @nektar/* through package exports → dist/;
      # without a build every workspace import is couldNotResolve
      - run: pnpm -r build
      - name: lint (incl. type-aware) · format · version consistency · declared imports · dep graph · dead code · dupes · leftovers · secrets
        run: pnpm check:hygiene
      - name: shellcheck
        run: git ls-files '*.sh' | xargs shellcheck
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo "rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667" -color
      - name: hadolint
        run: docker run --rm -i "hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d" < Dockerfile
      - name: zizmor
        run: docker run --rm -v "$PWD:/repo" -w /repo "ghcr.io/zizmorcore/zizmor@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d" .github/workflows
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" -w /repo "zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f" git

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: build image (clean-checkout gate)
        run: docker build -t nektar:ci .
      - name: smoke — every packaged module resolves inside the image
        run: |
          docker run --rm --entrypoint node nektar:ci --input-type=module -e "
            import { readdirSync } from 'node:fs'
            import { pathToFileURL } from 'node:url'
            const dir = '/app/dist/src'
            const files = readdirSync(dir, { recursive: true })
              .filter((f) => f.endsWith('.js') && !f.endsWith('bin.js') && !f.endsWith('init.js'))
            for (const f of files) await import(pathToFileURL(dir + '/' + f).href)
            console.log('smoke: ' + files.length + ' packaged modules resolve')
          "
        timeout-minutes: 3
