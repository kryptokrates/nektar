# Nektar v0.4 Hub — Collapsed from 12 containers + 2x MariaDB + Node watch/header shims
# down to ONE static Go binary hosting:
#   - Nektar Agent (MCP + HTTP + A2A + L0 LLM Proxy + Svelte Dashboard + Restate services)
#   - Embedded Go Overlay Hub (tm_nektar_<net>_0..f, ls_nektar, bfinger, bbox, blogs, borg, bsecret, bstore)
#   - Native SSE /hub/events push (zero watch-shim containers, zero MySQL/MariaDB!)
#
#   docker compose -f deploy/hub/compose.yaml up -d
#   docker compose -f deploy/hub/compose.yaml --profile tls up -d
name: nektar-hub
services:
  hub:
    image: ghcr.io/kryptokrates/nektar:${NEKTAR_IMAGE_TAG:-latest}${NEKTAR_IMAGE_DIGEST:+@${NEKTAR_IMAGE_DIGEST}}
    restart: unless-stopped
    command: ['serve', '-listen', ':8080', '-restate-listen', ':9080', '-hub']
    ports:
      - '${NEKTAR_HTTP_PORT:-8080}:8080'
    environment:
      NEKTAR_NETWORK: ${NEKTAR_NETWORK:-testnet}
      NEKTAR_DATA_DIR: /data
      NEKTAR_EMBED_HUB: '1'
      NEKTAR_PUBLIC_URL: ${NEKTAR_PUBLIC_URL:-}
      NEKTAR_API_TOKEN: ${NEKTAR_API_TOKEN:-}
      NEKTAR_HEADERS_SOURCE: ${NEKTAR_HEADERS_SOURCE:-woc:test}
      NEKTAR_SETTLE_SPEC: ${NEKTAR_SETTLE_SPEC:-}
      NEKTAR_ARCADE_KEY: ${NEKTAR_ARCADE_KEY:-}
      NEKTAR_WOC_KEY: ${NEKTAR_WOC_KEY:-}
      NEKTAR_MAINNET_CONFIRM: ${NEKTAR_MAINNET_CONFIRM:-}
      # Optional Lightweb Go modules mounted directly in-process when configured:
      BBOX_OFFICES: ${BBOX_OFFICES:-}
      BLOGS_STREAMS: ${BLOGS_STREAMS:-}
      BORG_HALLS: ${BORG_HALLS:-}
      BSECRET_CRYPTS: ${BSECRET_CRYPTS:-}
      BSTORE_BUCKETS: ${BSTORE_BUCKETS:-}
    volumes:
      - hub-data:/data

  restate:
    profiles: [restate]
    image: docker.restate.dev/restatedev/restate:1.8.1
    restart: unless-stopped
    environment:
      RESTATE_NODE_NAME: nektar-hub
    volumes:
      - restate-data:/restate-data

  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      NEKTAR_DOMAIN: ${NEKTAR_DOMAIN:-:80}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - hub

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', '--url', 'http://hub:8080']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - hub

configs:
  caddyfile:
    content: |
      {$NEKTAR_DOMAIN::80} {
        reverse_proxy hub:8080 {
          flush_interval -1
        }
      }

volumes:
  hub-data: {}
  restate-data: {}
  caddy-data: {}
  caddy-config: {}
