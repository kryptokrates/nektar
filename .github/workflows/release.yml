name: release
on:
  push:
    branches: [master, main]
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nektar
          tags: |
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=nektar
            org.opencontainers.image.description=Verifiable, encrypted agent memory on BSV — MCP server
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: smoke the pushed image
        run: docker run --rm --entrypoint node ghcr.io/${{ github.repository_owner }}/nektar:${{ github.ref_type == 'tag' && 'latest' || 'edge' }} packages/mcp/demo/client.mjs
        timeout-minutes: 3
      # the minimal rv image — overlay + core only; the fleet runs this, not the fat one
      - name: meta nektar-rv
        id: meta-rv
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nektar-rv
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/k3s/Dockerfile.rv
          push: true
          tags: ${{ steps.meta-rv.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm
        run: corepack enable && corepack prepare pnpm@12.16.1 --activate
      - name: pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
        timeout-minutes: 10
      - run: node tools/bundle-mcp.mjs
      - name: tar the self-contained bundle
        run: tar -czf nektar-mcp-bundle.tar.gz -C dist-bundle .
      - name: upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: nektar-mcp-bundle
          path: nektar-mcp-bundle.tar.gz
          if-no-files-found: error
      - name: attach to the GitHub release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: nektar-mcp-bundle.tar.gz

      # npm-publish removed — the bundle ships as a release asset
      # (nektar-mcp-bundle.tar.gz) and via the GHCR image instead
