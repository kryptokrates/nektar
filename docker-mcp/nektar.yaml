name: nektar
title: nektar — verifiable agent memory (BSV)
type: server
image: nektar:local
command:
  - mcp
longLived: true
volumes:
  - nektar-data:/data
env:
  - name: NEKTAR_NETWORK
    value: testnet
  - name: NEKTAR_TOOL_PROFILE
    value: operator
description: >-
  Encrypted, provenance-bearing agent memory anchored on BSV (v0.1 Pure-Go).
  Tools: remember, recall, forget, groundedAnswer, verifyReceipt, want, sell,
  deals, fund, doctor, peers, anchor, prove, borgGroup, exportPack, importPack,
  authorize, status. Proofs show what was recorded and unaltered — never that it is true.
