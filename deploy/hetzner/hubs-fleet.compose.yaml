# Nektar v0.1 — 5-Hub Federated Fleet under nektar.run (hub1..hub5.nektar.run)
# Each Hub runs the single Pure-Go binary + embedded Restate 1.8.1 sidecar in isolated storage,
# federated with the primary Spine Hub (https://nektar.run) and peered with all sibling hubs.
name: nektar-fleet

x-hub-common: &hub-common
  image: ghcr.io/kryptokrates/nektar:${NEKTAR_IMAGE_TAG:-edge}
  restart: unless-stopped
  command: ['serve', '-listen', ':18420', '-hub']
  mem_limit: 512m
  environment: &hub-env
    NEKTAR_NETWORK: testnet
    NEKTAR_DATA_DIR: /data
    NEKTAR_HTTP_PORT: '18420'
    NEKTAR_CONTAINER: '1'
    NEKTAR_EMBED_HUB: '1'
    NEKTAR_TRUST_PROXY: '1'
    NEKTAR_HUB_ROLE: leaf
    NEKTAR_HUB_FEE_PRESET: hybrid
    NEKTAR_UPSTREAM_SPINES: https://nektar.run
    NEKTAR_PEER_HUBS: https://nektar.run,https://hub1.nektar.run,https://hub2.nektar.run,https://hub3.nektar.run,https://hub4.nektar.run,https://hub5.nektar.run
    NEKTAR_HEADERS_SOURCE: woc:test
    NEKTAR_SETTLE_SPEC: broadcaster:testnet
    NEKTAR_MAX_FEE_PER_TX: '2000'
    NEKTAR_MAX_SPEND_PER_DAY: '100000'
    NEKTAR_FAUCET_DAILY_CAP: '20000'
    NEKTAR_HTTP_TOKEN: ${NEKTAR_HTTP_TOKEN:-}
    NEKTAR_OPERATOR_TOKEN: ${NEKTAR_OPERATOR_TOKEN:-}

services:
  hub1:
    <<: *hub-common
    ports:
      - '127.0.0.1:18421:18420'
    environment:
      <<: *hub-env
      NEKTAR_PUBLIC_URL: https://hub1.nektar.run
      NEKTAR_SEED_DOMAINS: ops,nektar,agents
    volumes:
      - hub1-data:/data

  hub2:
    <<: *hub-common
    ports:
      - '127.0.0.1:18422:18420'
    environment:
      <<: *hub-env
      NEKTAR_PUBLIC_URL: https://hub2.nektar.run
      NEKTAR_SEED_DOMAINS: bsv,spv,runar
    volumes:
      - hub2-data:/data

  hub3:
    <<: *hub-common
    ports:
      - '127.0.0.1:18423:18420'
    environment:
      <<: *hub-env
      NEKTAR_PUBLIC_URL: https://hub3.nektar.run
      NEKTAR_SEED_DOMAINS: travel,deals,prosumer
    volumes:
      - hub3-data:/data

  hub4:
    <<: *hub-common
    ports:
      - '127.0.0.1:18424:18420'
    environment:
      <<: *hub-env
      NEKTAR_PUBLIC_URL: https://hub4.nektar.run
      NEKTAR_SEED_DOMAINS: research,workflows,ai
    volumes:
      - hub4-data:/data

  hub5:
    <<: *hub-common
    ports:
      - '127.0.0.1:18425:18420'
    environment:
      <<: *hub-env
      NEKTAR_PUBLIC_URL: https://hub5.nektar.run
      NEKTAR_SEED_DOMAINS: devops,cloud,security
    volumes:
      - hub5-data:/data

volumes:
  hub1-data: {}
  hub2-data: {}
  hub3-data: {}
  hub4-data: {}
  hub5-data: {}
