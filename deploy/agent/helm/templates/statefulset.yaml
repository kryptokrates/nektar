apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nektar-agent.fullname" . }}
  labels:
    {{- include "nektar-agent.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "nektar-agent.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "nektar-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nektar-agent.labels" . | nindent 8 }}
    spec:
      # the agent never calls the k8s API — don't hand it a token it can't use
      automountServiceAccountToken: false
      securityContext:
        # v0.4 Go image runs as non-root nektar user (uid 10001)
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- else }}:{{ .Values.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "-listen", ":18420", "-restate-listen", "127.0.0.1:9080"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 18420
          startupProbe:
            httpGet:
              path: /v1/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 10
            failureThreshold: 2
          env:
            - name: NEKTAR_NETWORK
              value: {{ .Values.network | quote }}
            - name: NEKTAR_DATA_DIR
              value: /data
            - name: NEKTAR_HTTP_PORT
              value: "18420"
            - name: NEKTAR_MODEL_ID
              value: {{ .Values.modelId | quote }}
            - name: NEKTAR_MARKET_HOSTS
              value: {{ required "marketHosts is required" .Values.marketHosts | quote }}
            - name: NEKTAR_PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            - name: NEKTAR_VERIFY_BASE
              value: {{ .Values.verifyBase | default .Values.publicUrl | quote }}
            - name: NEKTAR_TRUST_PROXY
              value: {{ ternary "1" "0" .Values.trustProxy | quote }}
            - name: NEKTAR_HEADERS_SOURCE
              value: {{ .Values.headersSource | quote }}
            - name: NEKTAR_SETTLE_SPEC
              value: {{ .Values.settleSpec | quote }}
            - name: NEKTAR_MAINNET_CONFIRM
              value: {{ .Values.mainnetConfirm | quote }}
            # the executor sidecar shares this pod's net namespace — loopback
            # is CORRECT here (the one topology where it is): no DNS, no
            # routing, no host-gateway to get wrong.
            - name: NEKTAR_RESTATE_URL
              value: "http://127.0.0.1:8111"
            - name: NEKTAR_RESTATE_ADMIN
              value: "http://127.0.0.1:9070"
            - name: NEKTAR_RESTATE_ENDPOINT_URI
              value: "http://127.0.0.1:9080"
            - name: NEKTAR_RESTATE_IDENTITY_KEY
              value: {{ .Values.restate.identityPublicKey | default "" | quote }}
            - name: NEKTAR_MAX_FEE_PER_TX
              value: {{ .Values.maxFeeSatsPerTx | quote }}
            - name: NEKTAR_MAX_SPEND_PER_DAY
              value: {{ .Values.maxSpendSatsPerDay | quote }}
            - name: NEKTAR_HTTP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nektar-agent.secretName" . }}
                  key: NEKTAR_HTTP_TOKEN
            - name: NEKTAR_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nektar-agent.secretName" . }}
                  key: NEKTAR_OPERATOR_TOKEN
                  optional: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        # the durable executor is required infrastructure — same pod, its
        # journals on their own claim so a data-volume snapshot/replace
        # doesn't cross-pollinate the two durable stores
        - name: restate
          image: "{{ .Values.restate.image.repository }}:{{ .Values.restate.image.tag }}"
          imagePullPolicy: {{ .Values.restate.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # both containers share the pod's localhost — the agent's own
            # HTTP server owns :18420, ingress runs on :8111
            - name: RESTATE_INGRESS__BIND_PORT
              value: "8111"
            - name: RESTATE_NODE_NAME
              value: "nektar"
            - name: RESTATE_BASE_DIR
              value: "/restate-data"
          startupProbe:
            httpGet:
              path: /health
              port: 9070
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9070
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9070
            periodSeconds: 10
            failureThreshold: 2
          resources:
            {{- toYaml .Values.restate.resources | nindent 12 }}
          volumeMounts:
            - name: restate-data
              mountPath: /restate-data
            - name: restate-tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: restate-tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: restate-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.restate.persistence.storageClass }}
        storageClassName: {{ .Values.restate.persistence.storageClass | quote }}
        {{- else if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.restate.persistence.size }}
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
