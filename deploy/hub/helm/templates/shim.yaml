apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nektar-hub.fullname" . }}-shim
  labels:
    {{- include "nektar-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: shim
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nektar-hub.labels" . | nindent 6 }}
      app.kubernetes.io/component: shim
  template:
    metadata:
      labels:
        {{- include "nektar-hub.labels" . | nindent 8 }}
        app.kubernetes.io/component: shim
    spec:
      containers:
        - name: shim
          image: {{ include "nektar-hub.image" (dict "root" . "component" "shim") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ['node', 'header-shim.mjs']
          env:
            - name: SHIM_PORT
              value: "8080"
            - name: SHIM_MODE
              value: live
            - name: SHIM_BROADCASTER
              value: {{ .Values.shim.broadcaster | quote }}
            - name: SHIM_INDEX
              value: {{ .Values.shim.index | quote }}
            - name: SHIM_CHAINTRACKS
              value: {{ .Values.shim.chaintracks | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 3
            failureThreshold: 20
          resources:
            {{- toYaml (.Values.resources.shim | default .Values.resources) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nektar-hub.fullname" . }}-shim
  labels:
    {{- include "nektar-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: shim
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    {{- include "nektar-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: shim
