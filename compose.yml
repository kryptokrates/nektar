# nektar services. The Teranode regtest stack is separate (pnpm stack:up).
#   docker compose run --rm -i nektar-mcp   → MCP over stdio (attach an MCP client)
#   docker compose run --rm demo           → scripted agent session (smoke test)
#   docker compose up watcher              → the honest challenger, watching /data
services:
  nektar-mcp:
    build: .
    image: nektar:local
    stdin_open: true
    volumes:
      - nektar-data:/data # claims registry + proof store shared with watcher
    environment:
      NEKTAR_MODEL_ID: ${NEKTAR_MODEL_ID:-unspecified}
  # the 1-of-N honest challenger: re-verifies each open claim's RISC Zero
  # receipt off-chain and broadcasts `challenge` on any mismatch. Watches
  # the SAME /data registry the MCP server writes via claimDeploy.
  watcher:
    image: nektar:local
    entrypoint:
      ['node', 'packages/watcher/src/watcher.mjs', '--claims', '/data/claims.json', '--proof-dir', '/data/proofs', '--reserve', '/data/watcher-reserve.json']
    volumes:
      - nektar-data:/data
      # Teranode quickstart creds, read-only (watcher maps rpc_user/rpc_pass)
      - ./infra/teranode-quickstart/.env:/run/teranode-quickstart.env:ro
    env_file:
      - path: .env # repo root — carries NEKTAR_REGTEST_WIF (gitignored)
        required: false
    environment:
      NEKTAR_REGTEST_WIF: ${NEKTAR_REGTEST_WIF:-}
      NEKTAR_RPC_URL: ${NEKTAR_RPC_URL:-http://host.docker.internal:9292/}
      NEKTAR_RPC_USER: ${NEKTAR_RPC_USER:-teranode}
      NEKTAR_RPC_PASS: ${NEKTAR_RPC_PASS:-}
      NEKTAR_QS_ENV: /run/teranode-quickstart.env
      NEKTAR_PROPAGATION_URL: ${NEKTAR_PROPAGATION_URL:-http://host.docker.internal:8833/tx}
      NEKTAR_ASSET_URL: ${NEKTAR_ASSET_URL:-http://host.docker.internal:8090/api/v1}
  demo:
    image: nektar:local
    depends_on: [nektar-mcp]
    entrypoint: ['node', 'packages/mcp/demo/client.mjs']
    environment:
      NEKTAR_LLM_URL: ${NEKTAR_LLM_URL:-}
      NEKTAR_LLM_MODEL: ${NEKTAR_LLM_MODEL:-}

volumes:
  nektar-data:
