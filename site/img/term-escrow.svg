<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="Atomic Swap trades payment and decryption key in the exact same instant">
  <title>Atomic Swap — No-Scam Trade</title>
  <rect width="320" height="140" rx="12" fill="#151211"/>
  <!-- Buyer -->
  <rect x="16" y="34" width="78" height="58" rx="10" fill="#172019" stroke="#4cc26b" stroke-width="1.5"/>
  <text x="55" y="59" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="800" fill="#4cc26b">BUYER</text>
  <text x="55" y="76" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#958d85">60 sats</text>

  <!-- Seller -->
  <rect x="226" y="34" width="78" height="58" rx="10" fill="#221b15" stroke="#f7991b" stroke-width="1.5"/>
  <text x="265" y="59" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="800" fill="#f7991b">SELLER</text>
  <text x="265" y="76" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#958d85">Unlock Key</text>

  <!-- Top arrow: Sats -> -->
  <line x1="98" y1="50" x2="216" y2="50" stroke="#4cc26b" stroke-width="2.2"/>
  <polygon points="214,45 224,50 214,55" fill="#4cc26b"/>

  <!-- Bottom arrow: <- Key -->
  <line x1="222" y1="76" x2="104" y2="76" stroke="#f7991b" stroke-width="2.2"/>
  <polygon points="106,71 96,76 106,81" fill="#f7991b"/>

  <!-- Center Atomic Lock badge -->
  <circle cx="160" cy="63" r="19" fill="#151211" stroke="#f4efe6" stroke-width="1.8"/>
  <path d="M153 63 v-4 a7 7 0 0 1 14 0 v4" fill="none" stroke="#f7991b" stroke-width="2.2"/>
  <rect x="150" y="63" width="20" height="13" rx="3" fill="#f7991b"/>

  <text x="160" y="118" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#d5cec7">Both happen together — or neither happens</text>
</svg>
