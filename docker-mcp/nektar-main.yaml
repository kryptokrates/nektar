name: nektar-main
title: nektar — verifiable agent memory (BSV mainnet)
type: server
image: ghcr.io/kryptokrates/nektar:latest
command:
  - mcp
longLived: true
volumes:
  - nektar-main-data:/data
description: >-
  BSV mainnet deployment (real satoshis). Requires explicit confirmation
  NEKTAR_MAINNET_CONFIRM=I_UNDERSTAND and configured headers/settler endpoints.
  SpendGuard caps every broadcast fail-closed.
env:
  - name: NEKTAR_NETWORK
    value: main
  - name: NEKTAR_MAINNET_CONFIRM
    value: '{{nektar.mainnet_confirm}}'
  - name: NEKTAR_TOOL_PROFILE
    value: agent
  - name: NEKTAR_HEADERS_SOURCE
    value: woc:main,arcade:https://arcade-v2-us-1.bsvblockchain.tech,arcade:https://arcade-eu-1.bsvblockchain.tech
  - name: NEKTAR_SETTLE_SPEC
    value: broadcaster:main
  - name: NEKTAR_MAX_FEE_PER_TX
    value: '{{nektar.max_fee_per_tx}}'
  - name: NEKTAR_MAX_SPEND_PER_DAY
    value: '{{nektar.max_spend_per_day}}'
config:
  - name: nektar
    description: BSV mainnet deployment — real satoshis
    type: object
    properties:
      mainnet_confirm:
        type: string
        description: Must be set to I_UNDERSTAND to enable mainnet broadcasts
      max_fee_per_tx:
        type: integer
        description: Per-transaction fee cap in sats (default 1000)
      max_spend_per_day:
        type: integer
        description: Daily fee spend cap in sats (default 20000)
