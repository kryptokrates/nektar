<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720" role="img" aria-label="Eine Firewall lässt nur Agenten mit Ausweis zum Händler durch" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="540" height="720" fill="#fbf8f1"/>

  <!-- the wall with one gate -->
  <rect x="250" y="20" width="44" height="270" fill="#c2410c"/>
  <rect x="250" y="430" width="44" height="270" fill="#c2410c"/>
  <text transform="rotate(-90 272 160)" x="272" y="160" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#ffffff">FIREWALL</text>
  <text transform="rotate(-90 272 565)" x="272" y="565" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#ffffff">CDN</text>

  <!-- agent without badge, top: blocked -->
  <circle cx="80" cy="130" r="38" fill="#94a3b8"/>
  <text x="80" y="139" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Agent</text>
  <line x1="124" y1="130" x2="210" y2="130" stroke="#94a3b8" stroke-width="5"/>
  <line x1="214" y1="114" x2="242" y2="146" stroke="#c2410c" stroke-width="8" stroke-linecap="round"/>
  <line x1="242" y1="114" x2="214" y2="146" stroke="#c2410c" stroke-width="8" stroke-linecap="round"/>
  <text x="80" y="200" text-anchor="middle" font-size="22" fill="#475569">ohne Ausweis</text>

  <!-- agent with badge, middle: passes -->
  <circle cx="80" cy="360" r="38" fill="#14213d"/>
  <text x="80" y="369" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Agent</text>
  <rect x="100" y="316" width="44" height="30" rx="5" fill="#0f766e" stroke="#ffffff" stroke-width="3"/>
  <polyline points="110,331 119,340 134,322" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="124" y1="360" x2="356" y2="360" stroke="#0f766e" stroke-width="6"/>
  <polygon points="356,346 384,360 356,374" fill="#0f766e"/>
  <text x="80" y="430" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="600">mit Ausweis</text>

  <!-- agent without badge, bottom: blocked -->
  <circle cx="80" cy="590" r="38" fill="#94a3b8"/>
  <text x="80" y="599" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Agent</text>
  <line x1="124" y1="590" x2="210" y2="590" stroke="#94a3b8" stroke-width="5"/>
  <line x1="214" y1="574" x2="242" y2="606" stroke="#c2410c" stroke-width="8" stroke-linecap="round"/>
  <line x1="242" y1="574" x2="214" y2="606" stroke="#c2410c" stroke-width="8" stroke-linecap="round"/>
  <text x="80" y="660" text-anchor="middle" font-size="22" fill="#475569">ohne Ausweis</text>

  <!-- the shop -->
  <rect x="392" y="306" width="128" height="108" rx="10" fill="#0f766e"/>
  <text x="456" y="369" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Händler</text>
</svg>
