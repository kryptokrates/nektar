[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-memory-nektar"
version = "0.3.2"
description = "Hermes Agent MemoryProvider plugin for nektar — verifiable, encrypted BSV-anchored memory, receipts, and knowledge market."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.entry-points."hermes_agent.plugins"]
nektar = "hermes_memory_nektar:register"

[tool.setuptools.packages.find]
include = ["hermes_memory_nektar*"]
