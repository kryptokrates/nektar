<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720" role="img" aria-label="Im Buch steht nur ein kleiner Beleg, die Daten reisen daneben zu allen Hosts" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="540" height="720" fill="#fbf8f1"/>

  <!-- the book: a chain of blocks holding only receipts -->
  <text x="270" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#14213d">Im Buch: nur der Beleg</text>
  <g stroke="#14213d" stroke-width="5">
    <line x1="150" y1="130" x2="210" y2="130"/>
    <line x1="330" y1="130" x2="390" y2="130"/>
  </g>
  <g fill="#ffffff" stroke="#14213d" stroke-width="4">
    <rect x="30" y="80" width="120" height="100" rx="8"/>
    <rect x="210" y="80" width="120" height="100" rx="8"/>
    <rect x="390" y="80" width="120" height="100" rx="8"/>
  </g>
  <rect x="226" y="112" width="88" height="38" rx="6" fill="#0f766e"/>
  <text x="270" y="139" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Beleg</text>
  <text x="270" y="214" text-anchor="middle" font-size="22" fill="#475569">wenige hundert Bytes · für immer</text>

  <!-- the data beside it -->
  <line x1="270" y1="232" x2="270" y2="318" stroke="#0f766e" stroke-width="4" stroke-dasharray="8 8"/>
  <text x="286" y="284" font-size="22" font-weight="600" fill="#0f766e">beweist</text>
  <rect x="210" y="320" width="120" height="140" rx="8" fill="#ffffff" stroke="#14213d" stroke-width="4"/>
  <line x1="230" y1="356" x2="310" y2="356" stroke="#94a3b8" stroke-width="6"/>
  <line x1="230" y1="382" x2="310" y2="382" stroke="#94a3b8" stroke-width="6"/>
  <line x1="230" y1="408" x2="290" y2="408" stroke="#94a3b8" stroke-width="6"/>
  <text x="270" y="444" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Daten</text>
  <text x="350" y="380" font-size="22" fill="#475569">nie im Buch,</text>
  <text x="350" y="408" font-size="22" fill="#475569">rückziehbar</text>

  <!-- one publication, every host -->
  <g stroke="#0f766e" stroke-width="5">
    <line x1="270" y1="462" x2="90" y2="572"/>
    <line x1="270" y1="462" x2="270" y2="572"/>
    <line x1="270" y1="462" x2="450" y2="572"/>
  </g>
  <g fill="#0f766e">
    <rect x="30" y="574" width="120" height="64" rx="8"/>
    <rect x="210" y="574" width="120" height="64" rx="8"/>
    <rect x="390" y="574" width="120" height="64" rx="8"/>
  </g>
  <g font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="90" y="615">Host A</text>
    <text x="270" y="615">Host B</text>
    <text x="450" y="615">Host C</text>
  </g>
  <text x="270" y="686" text-anchor="middle" font-size="22" fill="#475569">einmal gesendet – alle halten dasselbe</text>
</svg>
