name: deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_stark:
        description: 'Rebuild the nektar-stark-build docker image (slow, ~30-60 min — only needed when tools/stark changes)'
        type: boolean
        default: false
concurrency:
  group: deploy
permissions:
  contents: read

jobs:
  hetzner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: pull → build → restart on the Hetzner box
        env:
          KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HOST: ${{ secrets.HETZNER_HOST }}
          BUILD_STARK: ${{ inputs.build_stark }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "root@$HOST" '
            set -e
            # one-time mamem → nektar migration (idempotent, every step self-guarded)
            for u in /etc/systemd/system/mamem-*.service; do
              [ -f "$u" ] || continue
              s=$(basename "$u" .service)
              systemctl stop "$s" 2>/dev/null || true
              systemctl disable "$s" 2>/dev/null || true
            done
            # every /opt|/var/lib|/etc/mamem* path → nektar* (merge if dest exists)
            for p in /opt/mamem* /var/lib/mamem* /etc/mamem*; do
              [ -e "$p" ] || continue
              d="${p/mamem/nektar}"
              if [ -e "$d" ]; then
                echo "merge $p → $d"
                cp -an "$p"/. "$d"/ && mv "$p" "$p.bak"
              else
                echo "move $p → $d"
                mv "$p" "$d"
              fi
            done
            [ -d /opt/nektar/.mamem ] && mv /opt/nektar/.mamem /opt/nektar/.nektar || true
            # env files: rename var names + paths only (never blind-replace inside values)
            for e in /etc/nektar*.env /opt/nektar/.env; do
              [ -f "$e" ] && sed -i "s/^MAMEM_/NEKTAR_/g; s|/opt/mamem|/opt/nektar|g; s|/var/lib/mamem|/var/lib/nektar|g; s|/etc/mamem|/etc/nektar|g" "$e" || true
            done
            for u in /etc/systemd/system/mamem-*.service /etc/systemd/system/nektar-*.service; do
              [ -f "$u" ] || continue
              sed -i "s|/opt/mamem|/opt/nektar|g; s|/var/lib/mamem|/var/lib/nektar|g; s|/etc/mamem|/etc/nektar|g; s/MAMEM_/NEKTAR_/g; s/mamem/nektar/g" "$u"
              case "$u" in
                *mamem-*) mv "$u" "/etc/systemd/system/nektar-$(basename "$u" | sed "s/^mamem-//")" ;;
              esac
            done
            systemctl daemon-reload
            for u in /etc/systemd/system/nektar-*.service; do
              [ -f "$u" ] || continue
              systemctl enable "$(basename "$u" .service)"
            done
            for f in /etc/nginx/conf.d/*mamem* /etc/nginx/sites-enabled/*mamem*; do
              [ -f "$f" ] && sed -i "s|/opt/mamem|/opt/nektar|g; s/mamem/nektar/g" "$f" && mv "$f" "${f/mamem/nektar}" || true
            done
            nginx -t 2>/dev/null && systemctl reload nginx || true
            cd /opt/nektar
            git fetch https://github.com/kryptokrates/nektar.git master
            git reset --hard FETCH_HEAD
            pnpm install --frozen-lockfile
            pnpm -r build
            # public endpoint: nektar-http must bind 0.0.0.0 (default is 127.0.0.1)
            grep -q "^NEKTAR_HTTP_HOST=" /etc/nektar-http.env 2>/dev/null || echo "NEKTAR_HTTP_HOST=0.0.0.0" >> /etc/nektar-http.env
            # --- nektar-prover: STARK HTTP shim (loopback only + token) ---
            if [ ! -f /etc/nektar-prover.env ]; then
              { echo PROVER_HOST=127.0.0.1; echo PROVER_PORT=8443; echo PROVER_DOCKER=1; echo "PROVER_TOKEN=$(openssl rand -hex 24)"; } > /etc/nektar-prover.env
              chmod 600 /etc/nektar-prover.env
            fi
            printf "%s\n" "[Unit]" "Description=nektar STARK prover HTTP shim" "After=network.target docker.service" "Requires=docker.service" "" "[Service]" "EnvironmentFile=/etc/nektar-prover.env" "WorkingDirectory=/opt/nektar/tools/stark" "ExecStart=/usr/local/bin/node prover-server.mjs" "Restart=always" "RestartSec=5" "" "[Install]" "WantedBy=multi-user.target" > /etc/systemd/system/nektar-prover.service
            systemctl daemon-reload
            systemctl enable --now nektar-prover
            systemctl restart nektar-http nektar-watch || {
              for s in nektar-http nektar-watch; do
                echo "=== unit $s ==="
                cat "/etc/systemd/system/$s.service" || true
                echo "=== status $s ==="
                systemctl status "$s" --no-pager -l || true
                journalctl -u "$s" -n 10 --no-pager || true
              done
              echo "=== fs scan ==="
              ls -la /opt/ | grep -iE "nektar|mamem|watch|http" || true
              ls /var/lib/ /etc/ 2>/dev/null | grep -iE "nektar|mamem" || true
              echo "=== leftover mamem units ==="
              systemctl list-units --all "*mamem*" --no-pager || true
              exit 1
            }
            sleep 3
            systemctl is-active nektar-http nektar-watch nektar-prover
            echo "=== bind check ==="
            ss -tlnp | grep -E "node|MainThread|:808" || true
            echo "=== env var names (values hidden) ==="
            grep -oE "^[A-Z_]+" /etc/nektar-http.env 2>/dev/null || echo "no env file"
            echo "=== http banner ==="
            journalctl -u nektar-http -n 5 --no-pager | grep -E "nektar:|Error|error" || true
            PORT=$(journalctl -u nektar-http -n 20 --no-pager | grep -oE "HTTP \+ MCP on :[0-9]+" | grep -oE "[0-9]+" | tail -1)
            echo "detected port: ${PORT:-none}"
            [ -n "$PORT" ] && curl -sf -m 5 "http://127.0.0.1:$PORT/.well-known/nektar" && echo " ← local OK"
            echo "=== prover health ==="
            curl -sf -m 5 http://127.0.0.1:8443/health && echo " ← prover OK"
            echo "=== STARK build (opt-in) ==="
            if [ "$BUILD_STARK" = "true" ]; then
              cd /opt/nektar
              docker build -f tools/stark/Dockerfile.build -t nektar-stark-build tools/stark
              docker images | grep nektar-stark
            else
              echo "skipped (set build_stark=true on dispatch to rebuild the prover image)"
            fi
          '
      - name: verify the public endpoint from outside
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
        run: curl -sf -m 10 "http://$HOST:8080/.well-known/nektar" && echo " ← public OK"
