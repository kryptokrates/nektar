version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: agent
      APP_PORT: 18420
      PROXY_AUTH_ADD: 'false'

  agent:
    image: ghcr.io/kryptokrates/nektar:latest
    restart: on-failure
    command: ['serve', '-listen', ':18420', '-hub']
    environment:
      NEKTAR_NETWORK: testnet
      NEKTAR_DATA_DIR: /data
      NEKTAR_HTTP_PORT: '18420'
      NEKTAR_EMBED_HUB: '1'
      NEKTAR_TRUST_PROXY: '1'
      NEKTAR_PUBLIC_URL: ${NEKTAR_PUBLIC_URL:-}
      NEKTAR_SEED_DOMAINS: '*'
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:18420/v1/health']
      interval: 30s
      timeout: 5s
      retries: 5
