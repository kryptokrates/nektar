<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720" role="img" aria-label="Ein Dokument darf kopiert werden, eine Münze nicht" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <g id="doc">
      <rect width="80" height="104" rx="6" fill="#ffffff" stroke="#14213d" stroke-width="4"/>
      <line x1="14" y1="26" x2="66" y2="26" stroke="#94a3b8" stroke-width="5"/>
      <line x1="14" y1="46" x2="66" y2="46" stroke="#94a3b8" stroke-width="5"/>
      <line x1="14" y1="66" x2="50" y2="66" stroke="#94a3b8" stroke-width="5"/>
    </g>
    <g id="coin">
      <circle r="44" fill="#fbbf24" stroke="#14213d" stroke-width="4"/>
      <text y="14" text-anchor="middle" font-size="40" font-weight="700" fill="#14213d">€</text>
    </g>
  </defs>
  <rect width="540" height="720" fill="#fbf8f1"/>

  <!-- copying a document: fine -->
  <text x="40" y="70" font-size="32" font-weight="700" fill="#14213d">Text, Bild, Ton</text>
  <use href="#doc" x="40" y="110"/>
  <line x1="140" y1="162" x2="212" y2="162" stroke="#14213d" stroke-width="5"/>
  <polygon points="212,150 236,162 212,174" fill="#14213d"/>
  <use href="#doc" x="256" y="94"/>
  <use href="#doc" x="286" y="114"/>
  <use href="#doc" x="316" y="134"/>
  <circle cx="462" cy="170" r="38" fill="#0f766e"/>
  <polyline points="444,172 458,186 482,156" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="40" y="290" font-size="28" fill="#0f766e" font-weight="600">kopieren: erwünscht</text>

  <line x1="40" y1="350" x2="500" y2="350" stroke="#d9dee7" stroke-width="3"/>

  <!-- copying money: must not happen -->
  <text x="40" y="430" font-size="32" font-weight="700" fill="#14213d">Geld</text>
  <use href="#coin" x="84" y="520"/>
  <line x1="140" y1="520" x2="212" y2="520" stroke="#14213d" stroke-width="5"/>
  <polygon points="212,508 236,520 212,532" fill="#14213d"/>
  <use href="#coin" x="290" y="506"/>
  <use href="#coin" x="336" y="534"/>
  <circle cx="462" cy="520" r="38" fill="#c2410c"/>
  <line x1="446" y1="504" x2="478" y2="536" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <line x1="478" y1="504" x2="446" y2="536" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <text x="40" y="650" font-size="28" fill="#c2410c" font-weight="600">kopieren: darf nie passieren</text>
</svg>
