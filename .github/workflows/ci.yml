name: ci
on:
  push:
    branches: [master, main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: unit & integration tests (race detector)
        run: go test -race -v ./...
      - name: static cross-compile smoke (CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/nektar-linux ./cmd/nektar
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/nektar-darwin ./cmd/nektar
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/nektar-win.exe ./cmd/nektar
          /tmp/nektar-linux version

  ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: build Svelte 5 dashboard
        working-directory: ui
        run: npm install --no-audit --no-fund && npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: build v0.4 single-binary image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: nektar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke — binary executes cleanly
        run: docker run --rm nektar:ci version
