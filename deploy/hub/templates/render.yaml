# Render Blueprint — 1-Click Cloud Nektar v0.4 Agent + Embedded Hub (single binary + disk).
services:
  - type: web
    name: nektar-hub
    runtime: image
    image:
      url: ghcr.io/kryptokrates/nektar:latest
    dockerCommand: serve -listen :18420 -restate-listen 127.0.0.1:9080 -hub
    healthCheckPath: /v1/health
    disk:
      name: nektar-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: NEKTAR_NETWORK
        value: testnet
      - key: NEKTAR_DATA_DIR
        value: /data
      - key: NEKTAR_HTTP_PORT
        value: '18420'
      - key: NEKTAR_EMBED_HUB
        value: '1'
      - key: NEKTAR_TRUST_PROXY
        value: '1'
      - key: NEKTAR_API_TOKEN
        generateValue: true
      - key: NEKTAR_OPERATOR_TOKEN
        generateValue: true
