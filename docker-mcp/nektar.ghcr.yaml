name: nektar
title: nektar — verifiable agent memory (BSV testnet)
type: server
image: ghcr.io/kryptokrates/nektar:latest
command:
  - mcp
longLived: true
volumes:
  - nektar-data:/data
description: >-
  Encrypted, provenance-bearing agent memory anchored on public BSV testnet
  (v0.1 Pure-Go single binary). Tools: remember, recall, forget, groundedAnswer,
  verifyReceipt, want, sell, deals, fund, doctor. Proofs show what was recorded
  and unaltered — never that it is true.
env:
  - name: NEKTAR_NETWORK
    value: testnet
  - name: NEKTAR_TOOL_PROFILE
    value: agent
  - name: NEKTAR_WALLET
    value: embedded
  - name: NEKTAR_MAX_FEE_PER_TX
    value: '{{nektar.max_fee_per_tx}}'
  - name: NEKTAR_MAX_SPEND_PER_DAY
    value: '{{nektar.max_spend_per_day}}'
  - name: NEKTAR_MODEL_RELEASE
    value: '{{nektar.model_release}}'
config:
  - name: nektar
    description: BSV testnet deployment — test coins only
    type: object
    properties:
      max_fee_per_tx:
        type: integer
        description: Per-transaction fee cap in sats (default 10000)
      max_spend_per_day:
        type: integer
        description: Daily fee spend cap in sats, UTC day (default 2000000)
      model_release:
        type: string
        description: Exact model identity bound into answer receipts
