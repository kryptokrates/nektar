{{- if and .Values.ingress.enabled .Values.ingress.agentHost }}
{{- $full := include "nektar-hub.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}-hub
  labels:
    {{- include "nektar-hub.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if and .Values.ingress.tls .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.ingress.agentHost | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.agentHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-hub
                port:
                  name: http
{{- end }}
