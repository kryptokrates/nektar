# Nektar v0.4 Agent — Single static Go binary + optional Restate & Caddy Auto-TLS.
#   docker compose -f deploy/agent/compose.yaml up -d
# Pass `--profile restate` for durable Restate market workflows, and `--profile tls` with NEKTAR_DOMAIN for Let's Encrypt HTTPS.
name: nektar-agent
services:
  agent:
    image: ghcr.io/kryptokrates/nektar:${NEKTAR_IMAGE_TAG:-latest}${NEKTAR_IMAGE_DIGEST:+@${NEKTAR_IMAGE_DIGEST}}
    restart: unless-stopped
    command: ['serve', '-listen', ':8080', '-restate-listen', ':9080']
    ports:
      - '${NEKTAR_HTTP_BIND:-127.0.0.1}:${NEKTAR_HTTP_PORT:-8080}:8080'
    environment:
      NEKTAR_NETWORK: ${NEKTAR_NETWORK:-testnet}
      NEKTAR_DATA_DIR: /data
      NEKTAR_HTTP_PORT: '8080'
      NEKTAR_PUBLIC_URL: ${NEKTAR_PUBLIC_URL:-}
      NEKTAR_API_TOKEN: ${NEKTAR_API_TOKEN:-}
      NEKTAR_WALLET: ${NEKTAR_WALLET:-embedded}
      NEKTAR_HEADERS_SOURCE: ${NEKTAR_HEADERS_SOURCE:-woc:test}
      NEKTAR_CHAIN_SPEC: ${NEKTAR_CHAIN_SPEC:-}
      NEKTAR_SETTLE_SPEC: ${NEKTAR_SETTLE_SPEC:-}
      NEKTAR_ARCADE_KEY: ${NEKTAR_ARCADE_KEY:-}
      NEKTAR_WOC_KEY: ${NEKTAR_WOC_KEY:-}
      NEKTAR_OPENAI_UPSTREAM: ${NEKTAR_OPENAI_UPSTREAM:-https://api.openai.com}
      NEKTAR_ANTHROPIC_UPSTREAM: ${NEKTAR_ANTHROPIC_UPSTREAM:-https://api.anthropic.com}
      NEKTAR_MAX_FEE_PER_TX: ${NEKTAR_MAX_FEE_PER_TX:-10000}
      NEKTAR_MAX_SPEND_PER_TX: ${NEKTAR_MAX_SPEND_PER_TX:-100000}
      NEKTAR_MAX_SPEND_PER_DAY: ${NEKTAR_MAX_SPEND_PER_DAY:-2000000}
      NEKTAR_MAINNET_CONFIRM: ${NEKTAR_MAINNET_CONFIRM:-}
    volumes:
      - agent-data:/data

  restate:
    profiles: [restate]
    image: docker.restate.dev/restatedev/restate:1.8.1
    restart: unless-stopped
    environment:
      RESTATE_NODE_NAME: nektar
    volumes:
      - restate-data:/restate-data

  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      NEKTAR_DOMAIN: ${NEKTAR_DOMAIN:-:80}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - agent

configs:
  caddyfile:
    content: |
      {$NEKTAR_DOMAIN::80} {
        reverse_proxy agent:8080 {
          flush_interval -1
        }
      }

volumes:
  agent-data:
  restate-data:
  caddy-data:
  caddy-config:
