apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nektar-hub.fullname" . }}-db
  labels:
    {{- include "nektar-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  serviceName: {{ include "nektar-hub.fullname" . }}-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "nektar-hub.labels" . | nindent 6 }}
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        {{- include "nektar-hub.labels" . | nindent 8 }}
        app.kubernetes.io/component: db
    spec:
      containers:
        - name: db
          image: {{ include "nektar-hub.image" (dict "root" . "component" "db") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ['--innodb-buffer-pool-size=128M', '--performance-schema=OFF']
          env:
            - name: MYSQL_DATABASE
              value: overlay
            - name: MYSQL_USER
              value: overlay
            - name: MYSQL_RANDOM_ROOT_PASSWORD
              value: "yes"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nektar-hub.secretName" . }}
                  key: OVERLAY_DB_PASSWORD
          readinessProbe:
            exec:
              command: ['mysqladmin', 'ping', '-h', '127.0.0.1', '-uoverlay', '-p$(MYSQL_PASSWORD)', '--silent']
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 40
          resources:
            {{- toYaml (.Values.resources.db | default .Values.resources) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.dbSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nektar-hub.fullname" . }}-db
  labels:
    {{- include "nektar-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  selector:
    {{- include "nektar-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
