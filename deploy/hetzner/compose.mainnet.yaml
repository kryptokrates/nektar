# Nektar v0.1 — Dedicated Hetzner MAINNET Spine Hub Stack (side-by-side with Testnet)
#
# Runs with strictly isolated Docker volumes (hub-mainnet-data, hub-mainnet-backups)
# and binds loopback 127.0.0.1:18430 so existing Testnet Hub on 127.0.0.1:18420 stays untouched.
#
# Usage (from /opt/nektar):
#   docker compose \
#     --env-file deploy/hetzner/nektar-mainnet.env \
#     --env-file /opt/nektar/.env.mainnet \
#     -f deploy/hetzner/compose.mainnet.yaml up -d

name: nektar-mainnet

services:
  hub:
    image: ghcr.io/kryptokrates/nektar:${NEKTAR_IMAGE_TAG:-latest}${NEKTAR_IMAGE_DIGEST:+@${NEKTAR_IMAGE_DIGEST}}
    restart: unless-stopped
    command: ['serve', '-listen', ':18420', '-hub']
    ports:
      - '${NEKTAR_HTTP_BIND:-127.0.0.1}:${NEKTAR_HTTP_PORT:-18430}:18420'
    environment:
      NEKTAR_NETWORK: ${NEKTAR_NETWORK:-main}
      NEKTAR_MAINNET_CONFIRM: ${NEKTAR_MAINNET_CONFIRM:-}
      NEKTAR_DATA_DIR: /data
      NEKTAR_HTTP_PORT: '18420'
      NEKTAR_CONTAINER: '1'
      NEKTAR_EMBED_HUB: '1'
      NEKTAR_PUBLIC_URL: ${NEKTAR_PUBLIC_URL:-https://nektar.run}
      NEKTAR_TRUST_PROXY: ${NEKTAR_TRUST_PROXY:-1}
      NEKTAR_HTTP_TOKEN: ${NEKTAR_HTTP_TOKEN:-}
      NEKTAR_OPERATOR_TOKEN: ${NEKTAR_OPERATOR_TOKEN:-}
      NEKTAR_OPERATOR_PUBKEY: ${NEKTAR_OPERATOR_PUBKEY:-}
      NEKTAR_HUB_ROLE: ${NEKTAR_HUB_ROLE:-spine}
      NEKTAR_HUB_TRANSPORT: ${NEKTAR_HUB_TRANSPORT:-relay}
      NEKTAR_HUB_FEE_PRESET: ${NEKTAR_HUB_FEE_PRESET:-hybrid}
      NEKTAR_HUB_SUBMIT_WANT_SATS: ${NEKTAR_HUB_SUBMIT_WANT_SATS:-}
      NEKTAR_HUB_SUBMIT_OFFER_SATS: ${NEKTAR_HUB_SUBMIT_OFFER_SATS:-}
      NEKTAR_HUB_SUBMIT_ANNOUNCE_SATS: ${NEKTAR_HUB_SUBMIT_ANNOUNCE_SATS:-}
      NEKTAR_HUB_BBOX_SEND_SATS: ${NEKTAR_HUB_BBOX_SEND_SATS:-}
      NEKTAR_HUB_EGRESS_SATS_PER_100: ${NEKTAR_HUB_EGRESS_SATS_PER_100:-}
      NEKTAR_HUB_EGRESS_MIN_TOPUP_SATS: ${NEKTAR_HUB_EGRESS_MIN_TOPUP_SATS:-}
      NEKTAR_HUB_LOOKUP_PRICES: ${NEKTAR_HUB_LOOKUP_PRICES:-}
      NEKTAR_SPINE_PEER_PUBS: ${NEKTAR_SPINE_PEER_PUBS:-}
      NEKTAR_SEED_DOMAINS: ${NEKTAR_SEED_DOMAINS:-}
      NEKTAR_HEADERS_SOURCE: ${NEKTAR_HEADERS_SOURCE:-woc:main,arcade:https://arcade-v2-us-1.bsvblockchain.tech,arcade:https://arcade-eu-1.bsvblockchain.tech}
      NEKTAR_SETTLE_SPEC: ${NEKTAR_SETTLE_SPEC:-broadcaster:main}
      NEKTAR_SETTLE_DEPTH: ${NEKTAR_SETTLE_DEPTH:-6}
      NEKTAR_WALLET_PROFILE: ${NEKTAR_WALLET_PROFILE:-standard}
      NEKTAR_ARCADE_KEY: ${NEKTAR_ARCADE_KEY:-}
      NEKTAR_WOC_KEY: ${NEKTAR_WOC_KEY:-}
      NEKTAR_MAX_FEE_PER_TX: ${NEKTAR_MAX_FEE_PER_TX:-2000}
      NEKTAR_MAX_SPEND_PER_DAY: ${NEKTAR_MAX_SPEND_PER_DAY:-10000}
      NEKTAR_FAUCET_DAILY_CAP: '0'
      NEKTAR_NTP_SERVERS: ${NEKTAR_NTP_SERVERS:-time.cloudflare.com,time.google.com,pool.ntp.org}
      NEKTAR_BACKUP_DIR: ${NEKTAR_BACKUP_DIR:-/backups}
      NEKTAR_BACKUP_INTERVAL: ${NEKTAR_BACKUP_INTERVAL:-6h}
      NEKTAR_BACKUP_KEEP: ${NEKTAR_BACKUP_KEEP:-14}
      NEKTAR_BACKUP_S3_BUCKET: ${NEKTAR_BACKUP_S3_BUCKET:-}
      NEKTAR_BACKUP_S3_ENDPOINT: ${NEKTAR_BACKUP_S3_ENDPOINT:-}
      NEKTAR_BACKUP_S3_REGION: ${NEKTAR_BACKUP_S3_REGION:-}
      NEKTAR_BACKUP_S3_PREFIX: ${NEKTAR_BACKUP_S3_PREFIX:-}
      NEKTAR_BACKUP_S3_ACCESS_KEY: ${NEKTAR_BACKUP_S3_ACCESS_KEY:-}
      NEKTAR_BACKUP_S3_SECRET_KEY: ${NEKTAR_BACKUP_S3_SECRET_KEY:-}
    volumes:
      - hub-mainnet-data:/data
      - hub-mainnet-backups:/backups

volumes:
  hub-mainnet-data: {}
  hub-mainnet-backups: {}
