<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="Four machine-checked quality grades climbing from C clean text to B facts to A bonded to S live updates">
  <title>NMU-1 Quality Grades C, B, A, S</title>
  <rect width="320" height="140" rx="12" fill="#151211"/>
  <!-- 4 ascending bars -->
  <!-- C -->
  <rect x="16" y="68" width="66" height="54" rx="9" fill="#1e1a17" stroke="#3a342f" stroke-width="1.5"/>
  <text x="49" y="90" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="900" fill="#958d85">C</text>
  <text x="49" y="109" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#958d85">Clean text</text>

  <!-- B -->
  <rect x="90" y="52" width="66" height="70" rx="9" fill="#161d26" stroke="rgba(120,180,255,0.5)" stroke-width="1.5"/>
  <text x="123" y="78" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="900" fill="#78b4ff">B</text>
  <text x="123" y="98" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#d5cec7">Structured</text>
  <text x="123" y="111" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#78b4ff">facts</text>

  <!-- A -->
  <rect x="164" y="34" width="66" height="88" rx="9" fill="#152119" stroke="rgba(76,194,107,0.55)" stroke-width="1.6"/>
  <text x="197" y="64" text-anchor="middle" font-family="ui-monospace,monospace" font-size="17" font-weight="900" fill="#4cc26b">A</text>
  <text x="197" y="86" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#d5cec7">Quoted +</text>
  <text x="197" y="100" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#4cc26b">Bonded</text>

  <!-- S -->
  <rect x="238" y="16" width="66" height="106" rx="9" fill="#251c13" stroke="#f7991b" stroke-width="2"/>
  <text x="271" y="48" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" font-weight="900" fill="#f7991b">S</text>
  <text x="271" y="72" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#f4efe6">Bonded +</text>
  <text x="271" y="86" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" font-weight="700" fill="#f7991b">Live feed</text>
  <circle cx="271" cy="105" r="4" fill="#4cc26b"/>
</svg>
