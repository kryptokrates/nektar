name: nektar
title: nektar — verifiable agent memory (BSV)
type: server
image: nektar:local
# stateful server: keep one container per gateway session, data in a named volume
longLived: true
volumes:
  - nektar-data:/data
description: >-
  Encrypted, provenance-bearing agent memory whose history is anchored on BSV.
  Tools: remember, recall, prove, anchor, ZK membership/clearance, rotate,
  revoke, disclose, authorize, automaton. Proofs show what was recorded and
  unaltered — never that it is true.
