# agent — one-command nektar agent on the published image.
#   cp .env.example .env   → edit the marked values
#   docker compose -f deploy/agent/compose.yaml --env-file deploy/agent/.env up -d
# Everything the agent publishes/accepts is signed + SPV-verified peer-side —
# the hosts it talks to are untrusted plumbing, so this compose needs no
# private infrastructure to join the market.
name: nektar-agent
services:
  agent:
    # tag is human-readable only — set NEKTAR_IMAGE_DIGEST=sha256:<hex> in .env
    # to pin the exact image bits (recommended on any box holding real keys)
    image: ghcr.io/kryptokrates/nektar:${NEKTAR_IMAGE_TAG:-latest}${NEKTAR_IMAGE_DIGEST:+@${NEKTAR_IMAGE_DIGEST}}
    restart: unless-stopped
    ports:
      # HTTP + MCP surface. /v1/lane (peer push), /.well-known/nektar, /v1/pack
      # and /v1/verify are public by design; everything else needs the bearer.
      - '${NEKTAR_HTTP_PORT:-8080}:8080'
    environment:
      NEKTAR_NETWORK: ${NEKTAR_NETWORK:-testnet}
      NEKTAR_DATA_DIR: /data
      NEKTAR_HTTP_PORT: '8080'
      NEKTAR_HTTP_HOST: '0.0.0.0'
      NEKTAR_KEY_PASSPHRASE: ${NEKTAR_KEY_PASSPHRASE:?set NEKTAR_KEY_PASSPHRASE in .env}
      NEKTAR_HTTP_TOKEN: ${NEKTAR_HTTP_TOKEN:?set NEKTAR_HTTP_TOKEN in .env}
      NEKTAR_MODEL_ID: ${NEKTAR_MODEL_ID:-unspecified}
      NEKTAR_AUTOMATION: ${NEKTAR_AUTOMATION:-1}
      NEKTAR_UNATTENDED: ${NEKTAR_UNATTENDED:-}
      NEKTAR_FUND_WIF: ${NEKTAR_FUND_WIF:-}
      NEKTAR_FUND_TXIDS: ${NEKTAR_FUND_TXIDS:-}
      NEKTAR_MARKET_LOCAL_HOSTS: ${NEKTAR_MARKET_LOCAL_HOSTS:-}
      # unset = the baked-in seed hosts for this network (testnet defaults
      # join the public quorum); set to pin your own host pair
      NEKTAR_MARKET_HOSTS: ${NEKTAR_MARKET_HOSTS:-}
      NEKTAR_ANNOUNCE: ${NEKTAR_ANNOUNCE:-}
      NEKTAR_SEED_DOMAINS: ${NEKTAR_SEED_DOMAINS-*}
      # an anchored (ancestry-proven, own proof in flight) tree may serve
      # every lane — a cold agent's first carrier rides the mint broadcast,
      # not a block wait. Hosts without the anchored-admission patch refuse
      # the carrier; the lane then waits for the proof like before.
      NEKTAR_ANCHORED_LANES: ${NEKTAR_ANCHORED_LANES:-all}
      NEKTAR_WATCH_URLS: ${NEKTAR_WATCH_URLS:-}
      NEKTAR_WATCH_PUBLIC: ${NEKTAR_WATCH_PUBLIC:-}
      NEKTAR_BFINGER_PUBLISH: ${NEKTAR_BFINGER_PUBLISH:-}
      NEKTAR_PUSH_PUBLIC: ${NEKTAR_PUSH_PUBLIC:-}
      NEKTAR_COLLECT_QUIET_MS: ${NEKTAR_COLLECT_QUIET_MS:-}
      NEKTAR_MIN_COLLECT_MS: ${NEKTAR_MIN_COLLECT_MS:-}
      NEKTAR_MAX_FEE_SATS_PER_TX: ${NEKTAR_MAX_FEE_SATS_PER_TX:-}
      NEKTAR_MAX_SPEND_SATS_PER_DAY: ${NEKTAR_MAX_SPEND_SATS_PER_DAY:-}
      NEKTAR_MIN_BROADCAST_INTERVAL_MS: ${NEKTAR_MIN_BROADCAST_INTERVAL_MS:-}
      NEKTAR_MAINNET_CONFIRM: ${NEKTAR_MAINNET_CONFIRM:-}
      NEKTAR_PAYMENTS: ${NEKTAR_PAYMENTS:-}
      NEKTAR_PAID_DISCLOSURE: ${NEKTAR_PAID_DISCLOSURE:-}
      # the durable executor is required infrastructure — without a sidecar
      # the node refuses to boot. Service-name URI: the loopback class of
      # container/DNS traps cannot exist on a shared compose network.
      NEKTAR_RESTATE_URL: http://restate:8080
      NEKTAR_RESTATE_ADMIN: http://restate:9070
      NEKTAR_RESTATE_ENDPOINT_URI: http://agent:9080
    volumes:
      # durable identity + wallet + journals — this volume IS the agent
      - agent-data:/data
    depends_on:
      restate:
        condition: service_started
  # the agent's private executor plane — co-located, never published.
  # Its journals are the second durable store beside the data volume.
  restate:
    image: docker.restate.dev/restatedev/restate:1.8.1
    restart: unless-stopped
    volumes:
      - restate-data:/restate-data
volumes:
  agent-data:
  restate-data:
