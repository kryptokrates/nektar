# CasaOS 1-Click App Store Manifest (Nektar v0.1 Pure-Go)
name: nektar
services:
  nektar:
    image: ghcr.io/kryptokrates/nektar:latest
    container_name: nektar
    restart: unless-stopped
    command: ['serve', '-listen', ':18420', '-restate-listen', '127.0.0.1:9080', '-hub']
    ports:
      - target: 18420
        published: '18420'
        protocol: tcp
    environment:
      NEKTAR_NETWORK: testnet
      NEKTAR_DATA_DIR: /data
      NEKTAR_HTTP_PORT: '18420'
      NEKTAR_EMBED_HUB: '1'
      NEKTAR_PUBLIC_URL: ''
      NEKTAR_SEED_DOMAINS: '*'
    volumes:
      - type: bind
        source: /DATA/AppData/nektar
        target: /data
    x-casaos:
      envs:
        - container: NEKTAR_NETWORK
          description:
            en_us: BSV network (testnet or main)
        - container: NEKTAR_PUBLIC_URL
          description:
            en_us: Optional public HTTPS URL for direct A2A trades (leave empty for NAT bbox relay)
      ports:
        - container: '18420'
          description:
            en_us: Dashboard, MCP HTTP, Overlay Hub, and L0 LLM Memory Proxy port
      volumes:
        - container: /data
          description:
            en_us: Persistent BRC-100 wallet, SQLite memory, and Hub state
x-casaos:
  architectures:
    - amd64
    - arm64
  main: nektar
  description:
    en_us: Verifiable, encrypted AI agent memory, 16-lane Overlay Hub, and knowledge market anchored on BSV.
  tagline:
    en_us: One verifiable brain for all your AI agents
  developer: kryptokrates
  author: kryptokrates
  icon: https://nektar.run/logo.svg
  title:
    en_us: Nektar
  category: AI
  port_map: '18420'
