# Two real reference hosts on public BSV mainnet — the canary variant of
# compose.testnet.yaml. Same images, same shape; only the chain scope and
# topic names differ.
#
#   docker compose -p nektar-bstack-mainnet -f deploy/bstack-sandbox/compose.mainnet.yaml up -d
#
# The shim (SHIM_MODE=live) serves host tracker/asset calls from the mainnet
# broadcaster + banana main index. There is no public mainnet chaintracks
# endpoint, so corroboration is single-source: SHIM_SINGLE_OK=1 serves lone
# answers in degraded mode — still SPV-verified, just not 2-of-2 (the same
# mode the testnet shim runs under index rate limits).
name: nektar-bstack-mainnet
services:
  db:
    image: ghcr.io/kryptokrates/nektar-hub-db:edge
    environment:
      MYSQL_DATABASE: overlay
      MYSQL_USER: overlay
      MYSQL_PASSWORD: spike
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    command: ['--innodb-buffer-pool-size=128M', '--performance-schema=OFF']
    healthcheck:
      test: ['CMD-SHELL', 'mariadb-admin ping -h 127.0.0.1 -uoverlay -pspike --silent']
      interval: 3s
      timeout: 2s
      retries: 40
    volumes:
      - db:/var/lib/mysql
  shim:
    image: ghcr.io/kryptokrates/nektar-shim:edge
    working_dir: /shim
    command: ['node', 'header-shim.mjs']
    environment:
      SHIM_PORT: 8080
      SHIM_MODE: live
      SHIM_BROADCASTER: https://arcade.gorillapool.io
      SHIM_INDEX: https://bananablocks.com/api/v1
      # no public mainnet chaintracks — lone-source mode (see header note)
      SHIM_SINGLE_OK: '1'
  watch-a:
    image: ghcr.io/kryptokrates/nektar-shim:edge
    working_dir: /shim
    restart: unless-stopped
    command: ['node', 'watch-shim.mjs']
    environment:
      BACKEND: http://host-a:8080
      PORT: 8080
    depends_on:
      host-a:
        condition: service_started
    ports:
      - '127.0.0.1:18393:8080'
  watch-b:
    image: ghcr.io/kryptokrates/nektar-shim:edge
    working_dir: /shim
    restart: unless-stopped
    command: ['node', 'watch-shim.mjs']
    environment:
      BACKEND: http://host-b:8080
      PORT: 8080
    depends_on:
      host-b:
        condition: service_started
    ports:
      - '127.0.0.1:18394:8080'
  host-a: &host
    image: ghcr.io/kryptokrates/nektar-bbox-host:edge
    depends_on:
      db:
        condition: service_healthy
      shim:
        condition: service_started
    environment: &hostenv
      BBOX_OFFICES: nektar_abcdefghij
      BLOGS_STREAMS: nektar_abcdefghij=open
      BLOGS_STATE_DIR: /var/lib/bbox/blogs
      BLOGS_KEEP_DAYS: 90
      OVERLAY_TOPICS: tm_bbox_nektar_abcdefghij,tm_log_nektar_abcdefghij,tm_finger,tm_nektar_main_0,tm_nektar_main_1,tm_nektar_main_2,tm_nektar_main_3,tm_nektar_main_4,tm_nektar_main_5,tm_nektar_main_6,tm_nektar_main_7,tm_nektar_main_8,tm_nektar_main_9,tm_nektar_main_a,tm_nektar_main_b,tm_nektar_main_c,tm_nektar_main_d,tm_nektar_main_e,tm_nektar_main_f
      OVERLAY_MODULES: /app/modules/bbox/bbox-module.js,/app/modules/nektar/nektar-module.js,/app/modules/blogs/blogs-module.js,/app/modules/finger/finger-module.js
      OVERLAY_CHAIN_TRACKER_URL: http://shim:8080
      BBOX_ASSET_URL: http://shim:8080
      OVERLAY_ADMIN_TOKEN: spike-token
      NEKTAR_NETS: main
      OVERLAY_KNEX_URL: mysql://overlay:spike@db:3306/overlay
    volumes:
      - host-state-a:/var/lib/bbox
    ports:
      - '127.0.0.1:18391:8080'
  host-b:
    <<: *host
    environment:
      <<: *hostenv
      OVERLAY_KNEX_URL: mysql://overlay:spike@db:3306/overlay_b
    volumes:
      - host-state-b:/var/lib/bbox
    ports:
      - '127.0.0.1:18392:8080'
volumes:
  db: {}
  host-state-a: {}
  host-state-b: {}
